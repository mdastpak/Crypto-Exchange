        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: End one of the signed-in user's sessions
      tags:
      - user sessions
  /api/v1/ws/:
    get:
      description: 'Upgrades to a WebSocket. An optional user access token comes as
        Authorization: Bearer, or from a browser as the subprotocols access_token
        and the token. docs/api.md describes the messages.'
      parameters:
      - description: Bearer <access token>
        in: header
        name: Authorization
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
        "400":
          description: Not a WebSocket handshake
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Connect to the WebSocket gateway
      tags:
      - websocket
  /system/healthcheck:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/system.HealthStatus'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/system.HealthStatus'
      summary: Readiness, by its earlier name
      tags:
      - system
  /system/live:
    get:
      description: Whether the process serves requests. Checks no dependency.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/system.HealthStatus'
      summary: Liveness
      tags:
      - system
