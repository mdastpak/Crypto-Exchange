      - description: The restriction's id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: The version the lift is based on
        in: query
        minimum: 1
        name: version
        type: integer
      - description: Why
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.LiftRestrictionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
