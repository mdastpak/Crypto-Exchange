            - properties:
                info:
                  $ref: '#/definitions/user.PasswordChanged'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: 'password_invalid: the current password is wrong'
          schema:
            $ref: '#/definitions/models.APIResponse'
        "429":
          description: password_locked, or a rate limit
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Set or change the account password
      tags:
      - user security
  /api/v1/user/profile:
