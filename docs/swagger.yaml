basePath: /
definitions:
  admin.CancelDelistingRequest:
    properties:
      version:
        description: Version is the version of the delisting that the cancel is based
          on.
        example: 1
        type: integer
    type: object
  admin.CancelMigrationRequest:
    properties:
      version:
        description: Version is the version of the migration that the cancel is based
          on.
        example: 1
        type: integer
    type: object
  admin.CapabilityOverrideRequest:
    properties:
      allowed:
        type: boolean
      note:
        description: Note says why, at most 1000 characters.
        type: string
    type: object
  admin.ControlList:
    properties:
      items:
        items:
          $ref: '#/definitions/platform.Control'
        type: array
    type: object
  admin.CreateControlRequest:
    properties:
      allow_networks:
        description: |-
          AllowNetworks and AllowUsers may still use the service during a
          maintenance, at most 50 of each: addresses or CIDR networks, and the
          UUIDs of users.
        items:
          type: string
        type: array
      allow_users:
        items:
          type: string
        type: array
      announce_at:
        description: |-
          AnnounceAt is when users learn of the control, before its start; now
          when absent.
        type: string
      ends_at:
        type: string
      feature:
        allOf:
        - $ref: '#/definitions/platform.Feature'
        description: |-
          Feature is the feature that a lockdown closes; a maintenance closes
          everything and takes none.
        enum:
        - sign_up
        - sign_in
        - profile_changes
        - deposits
        - withdrawals
        - trading
        - api_keys
        - websocket
        - read_only
        - scheduler
        - outbox
        - market_data
      kind:
        allOf:
        - $ref: '#/definitions/platform.Kind'
        enum:
        - maintenance
        - lockdown
      message:
        allOf:
        - $ref: '#/definitions/platform.Message'
        description: Message is shown to users, at most 500 characters per language.
      reason:
        description: Reason is for administrators, at most 1000 characters.
        type: string
      starts_at:
        description: |-
          StartsAt is now when absent; EndsAt, when set, ends the control
          without a lift.
        type: string
    type: object
  admin.CreateRestrictionRequest:
    properties:
      case_ref:
        description: CaseRef is the reference of the case, at most 64 characters.
        example: AML-2026-0042
        type: string
      currency_hk:
        description: CurrencyHK is the held currency of an asset restriction.
        format: uuid
        type: string
      ends_at:
        description: EndsAt, when set, ends the restriction without a lift.
        type: string
      note:
        description: Note is for administrators, at most 1000 characters.
        type: string
      operations:
        description: |-
          Operations are the blocked operations of an operation or asset
          restriction; an account freeze blocks everything and takes none.
        items:
          $ref: '#/definitions/restrictions.Operation'
          enum:
          - deposit
          - withdraw
          - convert
          - buy
          - sell
          - trade
        type: array
      reason:
        allOf:
        - $ref: '#/definitions/restrictions.Reason'
        enum:
        - court_order
        - aml_review
        - sanctions
        - fraud
        - security
        - user_request
        - other
      scope:
        allOf:
        - $ref: '#/definitions/restrictions.Scope'
        enum:
        - account
        - operation
        - asset
    type: object
  admin.CreatedRestriction:
    properties:
      ended_sessions:
        description: EndedSessions is the number of sessions that a freeze ended.
        example: 2
        type: integer
      restriction:
        $ref: '#/definitions/restrictions.Restriction'
    type: object
  admin.CurrencyPage:
    properties:
      items:
        items:
          $ref: '#/definitions/models.Currency'
        type: array
      next_cursor:
        description: NextCursor asks for the next page. It is left out on the last
          page.
        type: string
    type: object
  admin.DelistingList:
    properties:
      items:
        items:
          $ref: '#/definitions/delisting.Delisting'
        type: array
    type: object
  admin.LiftControlRequest:
    properties:
      note:
        description: Note says why, for the audit log, at most 1000 characters.
        type: string
    type: object
  admin.LiftRestrictionRequest:
    properties:
      note:
        description: Note says why, for the audit log, at most 1000 characters.
        type: string
    type: object
  admin.MigrationList:
    properties:
      items:
        items:
          $ref: '#/definitions/rebrand.Migration'
        type: array
    type: object
  admin.PlatformOverview:
    properties:
      controls:
        items:
          $ref: '#/definitions/platform.Control'
        type: array
      status:
        $ref: '#/definitions/platform.Status'
    type: object
  admin.RestrictionList:
    properties:
      items:
        items:
          $ref: '#/definitions/restrictions.Restriction'
        type: array
    type: object
  admin.UpdateControlRequest:
    properties:
      ends_at:
        description: EndsAt extends or shortens the control.
        type: string
      message:
        $ref: '#/definitions/platform.Message'
    type: object
  admin.adminSignInRequest:
    properties:
      email:
        type: string
    type: object
  admin.adminVerifyRequest:
    properties:
      otp:
        type: string
      totp:
        type: string
    type: object
  admin.currencyInfoFields:
    properties:
      contract:
        type: string
      en_name:
        type: string
      fa_name:
        type: string
      if_fiat:
        type: boolean
      is_token:
        type: boolean
      logo_url:
        type: string
      symbol:
        type: string
    type: object
  admin.currencyRequest:
    properties:
      info:
        $ref: '#/definitions/admin.currencyInfoFields'
      status:
        type: string
      version:
        description: |-
          Version is the version of the currency that an update is based on.
          When it is sent and the currency has changed since, the update is
          refused with 409. A create may not send it.
        type: integer
    type: object
  audit.Changes:
    properties:
      after:
        additionalProperties: true
        type: object
      before:
        additionalProperties: true
        type: object
    type: object
  audit.Entry:
    properties:
      action:
        example: currency.update
        type: string
      actor_id:
        description: ActorID is the hk of the user or administrator.
        format: uuid
        type: string
      actor_type:
        enum:
        - user
        - admin
        - anonymous
        - system
        type: string
      changes:
        $ref: '#/definitions/audit.Changes'
      hk:
        format: uuid
        type: string
      ip:
        example: 203.0.113.7
        type: string
      occurred_at:
        example: "2026-11-07T10:00:00Z"
        type: string
      outcome:
        enum:
        - success
        - failure
        - denied
        type: string
      reason:
        description: Reason is the code of a failure or a denial.
        example: authenticator_code_invalid
        type: string
      request_id:
        type: string
      target_id:
        type: string
      target_type:
        example: currency
        type: string
      user_agent:
        type: string
    type: object
  audit.EntryPage:
    properties:
      items:
        items:
          $ref: '#/definitions/audit.Entry'
        type: array
      next_cursor:
        description: NextCursor asks for the next page. It is left out on the last
          page.
        type: string
    type: object
  auth.SessionInfo:
    properties:
      auth_method:
        example: otp
        type: string
      created_at:
        type: string
      current:
        description: Current marks the session of the request.
        type: boolean
      expires_at:
        type: string
      id:
        format: uuid
        type: string
      ip:
        example: 203.0.113.7
        type: string
      last_used_at:
        type: string
      user_agent:
        type: string
    type: object
  auth.SessionPageDoc:
    properties:
      items:
        items:
          $ref: '#/definitions/auth.SessionInfo'
        type: array
      next_cursor:
        description: NextCursor asks for the next page. It is left out on the last
          page.
        type: string
    type: object
  currencies.Lifecycle:
    enum:
    - active
    - delist_announced
    - deposits_disabled
    - sell_only
    - trading_halted
    - withdrawal_only
    - frozen
    - delisted
    type: string
    x-enum-varnames:
    - LifecycleActive
    - LifecycleDelistAnnounced
    - LifecycleDepositsDisabled
    - LifecycleSellOnly
    - LifecycleTradingHalted
    - LifecycleWithdrawalOnly
    - LifecycleFrozen
    - LifecycleDelisted
  delisting.Delisting:
    properties:
      announcement_url:
        type: string
      cancelled_at:
        type: string
      cancelled_by:
        format: uuid
        type: string
      claim_days:
        example: 180
        type: integer
      completed_at:
        type: string
      created_at:
        type: string
      created_by:
        format: uuid
        type: string
      currency_hk:
        format: uuid
        type: string
      fixed_price:
        description: |-
          FixedPrice is the price of a fixed conversion, in the settlement
          currency, as a decimal string.
        example: "0.0125"
        type: string
      id:
        format: uuid
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/delisting.Kind'
        enum:
        - standard
        - emergency
      note:
        type: string
      price_source:
        allOf:
        - $ref: '#/definitions/delisting.PriceSource'
        enum:
        - last_trade
        - twap
        - fixed
      settlement:
        allOf:
        - $ref: '#/definitions/delisting.Settlement'
        enum:
        - convert
        - claim
      settlement_currency_hk:
        format: uuid
        type: string
      status:
        allOf:
        - $ref: '#/definitions/delisting.Status'
        enum:
        - scheduled
        - completed
        - cancelled
      steps:
        items:
          $ref: '#/definitions/delisting.Step'
        type: array
      version:
        example: 1
        type: integer
    type: object
  delisting.Kind:
    enum:
    - standard
    - emergency
    type: string
    x-enum-varnames:
    - KindStandard
    - KindEmergency
  delisting.Plan:
    properties:
      announcement_url:
        type: string
      claim_days:
        example: 180
        type: integer
      fixed_price:
        example: "0.0125"
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/delisting.Kind'
        enum:
        - standard
        - emergency
      note:
        type: string
      price_source:
        allOf:
        - $ref: '#/definitions/delisting.PriceSource'
        enum:
        - last_trade
        - twap
        - fixed
      settlement:
        allOf:
        - $ref: '#/definitions/delisting.Settlement'
        description: |-
          Settlement is convert, with settlement_currency_hk and price_source,
          or claim, with claim_days.
        enum:
        - convert
        - claim
      settlement_currency_hk:
        format: uuid
        type: string
      steps:
        items:
          $ref: '#/definitions/delisting.Step'
        type: array
    type: object
  delisting.PriceSource:
    enum:
    - last_trade
    - twap
    - fixed
    type: string
    x-enum-varnames:
    - PriceLastTrade
    - PriceTWAP
    - PriceFixed
  delisting.Settlement:
    enum:
    - convert
    - claim
    type: string
    x-enum-varnames:
    - SettlementConvert
    - SettlementClaim
  delisting.Status:
    enum:
    - scheduled
    - completed
    - cancelled
    type: string
    x-enum-varnames:
    - StatusScheduled
    - StatusCompleted
    - StatusCancelled
  delisting.Step:
    properties:
      applied_at:
        description: AppliedAt is when the scheduler applied it.
        type: string
      at:
        type: string
      state:
        allOf:
        - $ref: '#/definitions/currencies.Lifecycle'
        enum:
        - delist_announced
        - deposits_disabled
        - sell_only
        - trading_halted
        - withdrawal_only
        - frozen
        - delisted
    type: object
  favorites.Currency:
    properties:
      added_at:
        type: string
      en_name:
        example: Bitcoin
        type: string
      fa_name:
        example: بیت کوین
        type: string
      hk:
        format: uuid
        type: string
      status:
        description: |-
          Status is the currency's status: approved, or the suspend or deleted
          that came after the user added it.
        example: approved
        type: string
      symbol:
        example: BTC
        type: string
    type: object
  favorites.List:
    properties:
      currencies:
        items:
          $ref: '#/definitions/favorites.Currency'
        type: array
      pairs:
        items:
          $ref: '#/definitions/favorites.Pair'
        type: array
    type: object
  favorites.Pair:
    properties:
      added_at:
        description: AddedAt is when the user added it.
        type: string
      base:
        example: BTC
        type: string
      id:
        format: uuid
        type: string
      quote:
        example: USDT
        type: string
      status:
        example: ACTIVE
        type: string
    type: object
  marketdata.AssetPage:
    properties:
      items:
        items:
          $ref: '#/definitions/marketdata.AssetView'
        type: array
      next_cursor:
        description: NextCursor asks for the next page. It is left out on the last
          page.
        type: string
    type: object
  marketdata.AssetView:
    properties:
      active:
        type: boolean
      attribution:
        type: string
      circulating_supply:
        type: string
      contracts:
        description: Contracts are the contracts of a token, by network.
        items:
          $ref: '#/definitions/marketdata.Contract'
        type: array
      description:
        type: string
      kind:
        description: Kind is coin, token, or unknown.
        type: string
      label:
        type: string
      links:
        additionalProperties:
          type: string
        type: object
      logo_url:
        type: string
      market_cap_rank:
        type: integer
      max_supply:
        type: string
      name:
        type: string
      slug:
        type: string
      symbol:
        type: string
      total_supply:
        type: string
      updated_at:
        type: string
      verified:
        description: |-
          Verified is true only for an asset that an administrator linked to a
          currency listed on this exchange; Label says the same for display.
        type: boolean
    type: object
  marketdata.CandlePoint:
    properties:
      c:
        type: string
      h:
        type: string
      l:
        type: string
      o:
        type: string
      t:
        description: T is the open time of the candle.
        type: string
      v:
        description: V is the volume in the base asset.
        type: string
    type: object
  marketdata.Chart:
    properties:
      asset:
        type: string
      candles:
        items:
          $ref: '#/definitions/marketdata.CandlePoint'
        type: array
      from:
        type: string
      interval:
        type: string
      label:
        type: string
      quote:
        type: string
      to:
        type: string
      venue:
        type: string
      verified:
        type: boolean
    type: object
  marketdata.Contract:
    properties:
      address:
        type: string
      network:
        type: string
    type: object
  marketdata.VenueComparison:
    properties:
      asset:
        type: string
      label:
        type: string
      outlier_percent:
        type: string
      quotes:
        items:
          $ref: '#/definitions/marketdata.VenueQuote'
        type: array
      stale_after_seconds:
        type: integer
      verified:
        type: boolean
    type: object
  marketdata.VenueQuote:
    properties:
      ask:
        type: string
      bid:
        type: string
      high:
        type: string
      last:
        type: string
      low:
        type: string
      median:
        description: |-
          Median is the median of the fresh prices of the same quote, when
          enough venues have one.
        type: string
      observed_at:
        type: string
      open:
        type: string
      outlier:
        description: 'Outlier: the price is too far from the median of the venues.'
        type: boolean
      pair:
        type: string
      quote:
        type: string
      region:
        type: string
      stale:
        description: 'Stale: the ticker is older than the staleness limit.'
        type: boolean
      venue:
        type: string
      venue_name:
        type: string
      volume_base:
        type: string
      volume_quote:
        type: string
    type: object
  models.APIResponse:
    properties:
      code:
        description: |-
          Code names the error of a response of status 400 or more, for
          clients to act on; Message is for people and may change.
        type: string
      info:
        description: Info can hold any type of data (e.g., list or object)
      message:
        type: string
      request_id:
        description: |-
          RequestID is the X-Request-ID of an error response, to quote when
          reporting it.
        type: string
      status:
        type: integer
    type: object
  models.AccessTokenInfo:
    properties:
      access_token:
        example: eyJhbGciOiJSUzI1NiIsImtpZCI6Ii4uLiJ9...
        type: string
    type: object
  models.Currency:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      hk:
        type: string
      id:
        type: integer
      info:
        $ref: '#/definitions/models.CurrencyInfo'
      lifecycle:
        allOf:
        - $ref: '#/definitions/models.CurrencyLifecycle'
        description: |-
          Lifecycle is where the currency is in a delisting, and what users may
          do with it now (#216).
      migration:
        allOf:
        - $ref: '#/definitions/models.CurrencyMigration'
        description: |-
          Migration is the migration that moves the holders of this currency to
          another one, from its announcement on (#215).
      previous_symbols:
        description: |-
          PreviousSymbols are the symbols the currency had before a rebrand,
          newest first (#215). They stay reserved for it, and the lists find the
          currency by them.
        example:
        - MATIC
        items:
          type: string
        type: array
      status:
        type: string
      updated_at:
        type: string
      version:
        description: |-
          Version counts the changes of the currency. Only administrators see
          it; it is 0, and left out, in public responses.
        type: integer
    type: object
  models.CurrencyCapabilities:
    properties:
      buy:
        type: boolean
      convert_from:
        type: boolean
      convert_into:
        type: boolean
      deposit:
        type: boolean
      listed:
        description: |-
          Listed is false when the currency is left out of the public lists. It
          can still be read by its hk, for history.
        type: boolean
      sell:
        type: boolean
      withdraw:
        type: boolean
    type: object
  models.CurrencyCreatedInfo:
    properties:
      hk:
        format: uuid
        type: string
      status:
        example: pending
        type: string
      version:
        example: 1
        type: integer
    type: object
  models.CurrencyInfo:
    properties:
      contract:
        type: string
      en_name:
        type: string
      fa_name:
        type: string
      if_fiat:
        type: boolean
      is_token:
        type: boolean
      logo_url:
        description: LogoURL is the https URL of the currency's logo (#215), or empty.
        example: https://example.com/logos/usdt.svg
        type: string
      symbol:
        type: string
    type: object
  models.CurrencyLifecycle:
    properties:
      capabilities:
        allOf:
        - $ref: '#/definitions/models.CurrencyCapabilities'
        description: |-
          Capabilities says what users may do with the currency now: the
          capabilities of the state, with the overrides of administrators.
      next:
        allOf:
        - $ref: '#/definitions/models.CurrencyLifecycleStep'
        description: Next is the next scheduled step, when a delisting is under way.
      state:
        description: State is active, or the step of a delisting that the currency
          is at.
        enum:
        - active
        - delist_announced
        - deposits_disabled
        - sell_only
        - trading_halted
        - withdrawal_only
        - frozen
        - delisted
        example: active
        type: string
    type: object
  models.CurrencyLifecycleStep:
    properties:
      at:
        type: string
      state:
        example: deposits_disabled
        type: string
    type: object
  models.CurrencyMigration:
    properties:
      forced:
        description: |-
          Forced is true when holdings are converted, and false when the
          conversion is offered and the currency stays.
        type: boolean
      id:
        format: uuid
        type: string
      next:
        allOf:
        - $ref: '#/definitions/models.CurrencyMigrationPhase'
        description: Next is the next scheduled phase.
      phase:
        description: |-
          Phase is announced, deposits_paused, trading_halted, converting, or
          completed.
        enum:
        - announced
        - deposits_paused
        - trading_halted
        - converting
        - completed
        example: announced
        type: string
      ratio:
        description: |-
          Ratio is the units of the target that one unit of this currency
          becomes, as a decimal string.
        example: "1"
        type: string
      target_hk:
        format: uuid
        type: string
    type: object
  models.CurrencyMigrationPhase:
    properties:
      at:
        type: string
      phase:
        example: deposits_paused
        type: string
    type: object
  models.PingInfo:
    properties:
      message:
        example: pong
        type: string
      timestamp:
        example: "2026-11-07T10:00:00Z"
        type: string
    type: object
  models.SignInCodeInfo:
    properties:
      type:
        description: Type is the kind of contact the code was sent to.
        enum:
        - email
        - mobile
        example: email
        type: string
      username:
        description: Username is the contact, masked.
        example: ali*****@example.com
        type: string
      uuid:
        description: UUID identifies the sign-in session, for the verification.
        format: uuid
        type: string
    type: object
  models.SignInSessionInfo:
    properties:
      uuid:
        description: UUID identifies the sign-in session, for the verification.
        format: uuid
        type: string
    type: object
  models.VersionInfo:
    properties:
      version:
        example: 2
        type: integer
    type: object
  platform.Control:
    properties:
      active:
        description: Active is whether the control applies now.
        type: boolean
      allow_networks:
        description: |-
          AllowNetworks and AllowUsers may still use the service during a
          maintenance.
        items:
          type: string
        type: array
      allow_users:
        items:
          type: string
        type: array
      announce_at:
        description: AnnounceAt is when users learn of the control.
        type: string
      created_at:
        type: string
      created_by:
        description: |-
          CreatedBy, LiftRequestedBy, and LiftedBy are administrators; they
          are absent for a change made with cmd/admin.
        format: uuid
        type: string
      ends_at:
        type: string
      feature:
        allOf:
        - $ref: '#/definitions/platform.Feature'
        enum:
        - sign_up
        - sign_in
        - profile_changes
        - deposits
        - withdrawals
        - trading
        - api_keys
        - websocket
        - read_only
        - scheduler
        - outbox
        - market_data
      id:
        format: uuid
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/platform.Kind'
        enum:
        - maintenance
        - lockdown
      lift_note:
        type: string
      lift_requested_at:
        type: string
      lift_requested_by:
        format: uuid
        type: string
      lifted_at:
        type: string
      lifted_by:
        format: uuid
        type: string
      message:
        $ref: '#/definitions/platform.Message'
      reason:
        description: 'Reason is internal: users never see it.'
        type: string
      starts_at:
        description: |-
          StartsAt is when the control applies; EndsAt, when set, when it
          stops.
        type: string
      version:
        example: 1
        type: integer
    type: object
  platform.Feature:
    enum:
    - sign_up
    - sign_in
    - profile_changes
    - deposits
    - withdrawals
    - trading
    - api_keys
    - websocket
    - read_only
    - scheduler
