      - market data
  /api/v1/market-data/assets/{slug}/candles:
    get:
      description: 'The closed candles of the asset''s pair with the quote at the
        venue, oldest first, that open in [from, to): at most 1000. Without from,
        the last 500 candles before to; without to, up to now.'
      parameters:
      - description: The slug of the asset, such as bitcoin
        in: path
        name: slug
        required: true
        type: string
      - description: The venue, such as binance or nobitex
        in: query
        name: venue
        required: true
        type: string
      - description: The quote symbol, such as USDT or IRT
        in: query
        name: quote
        required: true
        type: string
      - description: 'The candle interval. The pairs of each collection tier are kept
          at some of them only: 1m for the hot pairs, 5m and 15m for the hot and active
          pairs.'
        enum:
        - 1m
        - 5m
        - 15m
        - 1h
        - 1d
        in: query
        name: interval
        required: true
        type: string
      - description: The first open time, RFC 3339
        format: date-time
        in: query
        name: from
        type: string
      - description: The end, exclusive, RFC 3339
        format: date-time
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/marketdata.Chart'
              type: object
        "304":
          description: 'Not modified: the If-None-Match matches'
        "400":
