  /api/v1/admin/step-up:
    post:
      consumes:
      - application/json
      description: The sensitive admin routes (platform controls, user restrictions,
        delistings, currency migrations, capability overrides, and re-seals) need
        a session that gave an authenticator (TOTP) code within admin.step_up_minutes;
        without it they answer 403 step_up_required. A sign-in counts as one. Each
        code is accepted once. A wrong code answers 401 code_invalid, and after 5
        wrong codes the next one ends the session. Audited as admin.step_up.
      parameters:
      - description: The authenticator code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.stepUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
