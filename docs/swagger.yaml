          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Restrict a user
      tags:
      - admin users
  /api/v1/admin/users/{hk}/restrictions/{id}/lift:
    post:
      consumes:
