  /api/v1/admin/integrity/findings/{id}/reseal:
    post:
      consumes:
      - application/json
      description: 'After a review found the current values of a row that did not
        match its seal right, as after a reviewed data fix, seals the row again with
        the current row-mac key and closes the finding. It needs two administrators:
        the first request records the reason and answers 202 with the finding and
        who asked; the same request by another administrator within 24 hours re-seals
        the row and answers 200. The administrator who asked cannot approve (403 second_approval_required),
        and neither step is open to the administrator whose account the row belongs
        to (403 own_row). The reason is required. Audited as integrity.reseal_request
        and integrity.reseal, with the values sealed now, secret ones masked. A finding
        that is already resolved answers 409 already_resolved; without data keys,
        503. The route needs a step-up.'
      parameters:
      - description: The finding's id
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Why the row is right
        in: body
        name: body
        required: true
