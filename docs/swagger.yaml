    get:
      description: 'The restrictions of a user, newest first, at most 200: every one,
        lifted and ended ones included, or with active=true only those that apply
        now. With the reasons, cases, and notes.'
      parameters:
      - description: The user's UUID
        format: uuid
        in: path
        name: hk
        required: true
        type: string
