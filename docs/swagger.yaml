      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.Profile'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Change the names and the preferences in the profile
      tags:
      - user
  /api/v1/user/recovery-codes:
    post:
      description: Replaces the ten recovery codes of the account, one of which resets
        a forgotten password. The codes that were not used stop working, and the new
        ones are shown once. It needs a fresh proof of the password (403 step_up_required),
        and a user without a password gets 409 second_factor_not_set.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.RecoveryCodes'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: step_up_required
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: second_factor_not_set
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Generate new recovery codes
      tags:
      - user security
  /api/v1/user/restrictions:
    get:
      description: 'The restrictions that apply now to the signed-in user: the operations
        they block, on every currency or on one, and when they end when that is shown.
        Never the reason. A frozen account cannot sign in, so it is not listed here:
        its requests answer 403 account_frozen. security_hold_until is when the hold
        that follows a change of a contact or of the second factor ends; until then,
        withdrawals answer 403 security_hold.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.RestrictionList'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: List my restrictions
      tags:
      - user
  /api/v1/user/security:
    get:
      description: Whether the account has a password, the second step of its sign-in,
        and since when.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.SecuritySettings'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Get the sign-in protections of the signed-in user
      tags:
      - user security
  /api/v1/user/sessions:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.RevokedSessions'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: End every session of the signed-in user but the current one
      tags:
      - user sessions
    get:
      description: The active sessions, newest first, with the session of the request
        marked current. Pages follow the pagination convention of docs/api.md.
      parameters:
      - description: The number of sessions, 50 by default
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - description: The next_cursor of the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/auth.SessionPageDoc'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: List the signed-in user's sessions
      tags:
      - user sessions
  /api/v1/user/sessions/{id}:
    delete:
      parameters:
      - description: The session, from the session list
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: End one of the signed-in user's sessions
      tags:
      - user sessions
  /api/v1/user/step-up:
    post:
      consumes:
      - application/json
      description: 'The operations that the second factor protects, such as changing
        a contact and, once they exist, deposits and withdrawals, need a session that
        proved the factor within security.second_factor.step_up_minutes (5 by default).
        A sign-in with the password counts; afterwards this route renews it with the
        account password. A wrong password answers 403 password_invalid and counts
        toward the lock of the password: 429 password_locked with Retry-After. A user
        without a password gets 409 second_factor_not_set.'
      parameters:
      - description: The account password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.StepUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.SteppedUp'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: password_invalid
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: second_factor_not_set
          schema:
            $ref: '#/definitions/models.APIResponse'
        "429":
          description: password_locked, or a rate limit
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Prove the second factor again
      tags:
      - user security
  /api/v1/user/step-up/passkey:
    post:
      description: Answers the options for navigator.credentials.get, bound to the
        session. The answer of the device goes, as passkey, to POST /user/step-up
        within five minutes, once.
      produces:
      - application/json
      responses:
        "200":
          description: The options, under publicKey
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/passkey.Options'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: 'passkey_not_found: the user has no passkey'
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: passkey_unavailable
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Get the options of a passkey proof for a step-up
      tags:
      - user-security
  /api/v1/user/totp:
    delete:
      description: Removes the authenticator of the user, also one that waits for
        its first code. The account password stays the second step. It needs a fresh
        proof of the second factor, and starts the security hold.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.TOTPChanged'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: second_factor_required or step_up_required
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: totp_not_enabled
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Turn the authenticator app off
      tags:
      - user-security
    post:
      description: 'Gives the user a new secret for an authenticator app (TOTP: RFC
        6238, SHA-1, 6 digits, 30 seconds), as text and as an otpauth URI for a QR
        code. The authenticator works once POST /user/totp/confirm has checked its
        first code; until then a new call replaces the secret. It comes after the
        account password, 409 second_factor_not_set without one, and needs a fresh
        proof of it: 403 step_up_required. 409 totp_enabled answers a user who has
        an authenticator.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/userauth.TOTPEnrollment'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: second_factor_required or step_up_required
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: totp_enabled or second_factor_not_set
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Start enrolling an authenticator app
      tags:
      - user-security
  /api/v1/user/totp/confirm:
    post:
      consumes:
      - application/json
      description: 'Checks the first code of the secret that POST /user/totp gave,
        and turns the authenticator on. From then on the user can prove the second
        step with a code of the app instead of the account password: at a sign-in,
        at a step-up, and to reset a forgotten password. It is a change of the second
        factor, so the security hold starts. 403 totp_invalid answers a wrong code;
        429 totp_locked after too many.'
      parameters:
      - description: The code that the app shows
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.TOTPCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.TOTPChanged'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: totp_invalid, second_factor_required, or step_up_required
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: 'totp_not_enabled: no secret waits for its code'
          schema:
            $ref: '#/definitions/models.APIResponse'
        "429":
          description: totp_locked
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Turn the authenticator app on
      tags:
      - user-security
  /api/v1/ws/:
    get:
      description: 'Upgrades to a WebSocket. An optional user access token comes as
        Authorization: Bearer, or from a browser as the subprotocols access_token
        and the token. docs/api.md describes the messages.'
      parameters:
      - description: Bearer <access token>
        in: header
        name: Authorization
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
        "400":
          description: Not a WebSocket handshake
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Connect to the WebSocket gateway
      tags:
      - websocket
  /system/live:
    get:
      description: Whether the process serves requests. Checks no dependency.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/system.HealthStatus'
      summary: Liveness
      tags:
      - system
  /system/ready:
    get:
      description: '503 while PostgreSQL or Redis is unavailable, or while the instance
        drains at shutdown. Without RabbitMQ it answers 200 with the status degraded:
        only the delivery of sign-in codes needs the broker.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/system.HealthStatus'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/system.HealthStatus'
      summary: Readiness
      tags:
      - system
securityDefinitions:
  BearerAuth:
    description: A user or an admin access token, as "Bearer <token>".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
