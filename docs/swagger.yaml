      - admin users
    post:
      consumes:
      - application/json
      description: Freezes the account (scope account), blocks operations on every
        currency (scope operation), or holds one currency (scope asset). A freeze
        ends every session of the user in the same transaction, so that their tokens
        stop working on every instance at once, and refuses sign-in with 403 account_frozen.
        The restriction applies until it is lifted or reaches ends_at. The reason,
        case, and note are never shown to the user. Audited as user.restriction_add,
        and each ended session as user.session_revoke with the reason account_frozen.
      parameters:
      - description: The user's UUID
        format: uuid
        in: path
