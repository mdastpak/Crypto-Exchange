      - admin platform
  /api/v1/admin/platform/controls:
    get:
      description: Every maintenance and lockdown, newest first, at most 200, lifted
        and ended ones included.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/admin.ControlList'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: List the platform controls
      tags:
      - admin platform
    post:
      consumes:
      - application/json
      description: Creates a full maintenance (kind maintenance), which closes every
        route of users with 503 maintenance except the status endpoint and sign-out,
        and closes their WebSocket connections; or a lockdown of one feature (kind
        lockdown), which refuses it with 503 feature_locked. Administrators are never
        closed out, and the sessions of users are kept. The control applies from starts_at
        (now when absent) until it is lifted or reaches ends_at, on every instance
        within platform.poll_interval_ms. Users see it on the status endpoint and
        over the WebSocket from announce_at. Audited as platform.control_create.
      parameters:
      - description: The control
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.CreateControlRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/platform.Control'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Put the service under maintenance, or lock a feature
      tags:
      - admin platform
  /api/v1/admin/platform/controls/{id}:
    patch:
      consumes:
      - application/json
      description: Extends or shortens a control that has not ended, or changes its
        message; the status endpoint, the WebSocket, and Retry-After follow. With
        version, the change is refused with 409 version_conflict when the control
        has changed since. An ended or lifted control answers 409 control_ended. Audited
        as platform.control_update.
      parameters:
      - description: The control's id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: The version the change is based on
        in: query
        minimum: 1
        name: version
        type: integer
      - description: The changes
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.UpdateControlRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/platform.Control'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Change the end or the message of a platform control
      tags:
      - admin platform
  /api/v1/admin/platform/controls/{id}/lift:
    post:
      consumes:
      - application/json
      description: 'Ends a control now, or cancels one that has not started. An active
        lockdown of a feature in platform.lift_approval (withdrawals and trading by
        default) needs two administrators: the first call records the request and
        answers 202, and a call by another administrator lifts it; the same administrator
        gets 409 second_approval_required. With version, the lift is refused with
        409 version_conflict when the control has changed since. An ended or lifted
        control answers 409 control_ended. Audited as platform.control_lift_request
        and platform.control_lift.'
      parameters:
      - description: The control's id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: The version the lift is based on
        in: query
        minimum: 1
        name: version
        type: integer
      - description: Why
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.LiftControlRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/platform.Control'
              type: object
        "202":
          description: The lift waits for another administrator
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/platform.Control'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Lift a platform control
      tags:
      - admin platform
