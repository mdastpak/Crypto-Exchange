  /api/v1/market-data/assets:
    get:
      description: 'The crypto assets of the global catalog. sort=rank (the default)
        lists them by market cap rank, the unranked last; sort=newest lists the one
        the catalog first collected last first, by created_at. A cursor holds its
        order: a cursor of one order is refused by the other. Every asset is unverified
        unless it is linked to a currency listed on this exchange. Cached for market_data.api.cache_seconds,
        with an ETag.'
      parameters:
      - description: The exact symbol, or a part of the name or slug, in any case
        in: query
        maxLength: 64
        name: q
        type: string
      - description: The order, rank by default
        enum:
        - rank
        - newest
        in: query
        name: sort
        type: string
      - description: The number of assets, 50 by default
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - description: The next_cursor of the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/marketdata.AssetPage'
              type: object
        "304":
          description: 'Not modified: the If-None-Match matches'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: List the assets of the market data catalog
      tags:
      - market data
