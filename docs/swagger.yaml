        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/admin.DelistingList'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: List the delistings of a currency
      tags:
      - admin currencies
    post:
      consumes:
      - application/json
      description: 'Schedules the steps that take an approved currency to delisted.
        A delisting that stopped before delisted, such as an emergency halt, stays
        scheduled, so that it can be cancelled to relist the currency; a new delisting
        supersedes it and takes the currency on from its state, with steps after it.
        A standard delisting starts with delist_announced; an emergency one, for a
        security or regulatory reason, at trading_halted or later. The steps follow
        the order of the lifecycle (delist_announced, deposits_disabled, sell_only,
        trading_halted, withdrawal_only, frozen, delisted), each at a later time,
        and any of them may be left out. Each step is applied at its time by the scheduler
        of the instances, exactly once, and changes the capabilities of the currency;
        a step that is due is applied at once. The settlement says what happens at
        frozen to the balances that are left: convert into another approved currency
        at a price, or hold for a claim; it is recorded and announced now, and carried
        out by the ledger. Audited as currency.delisting_schedule, and each step as
        currency.lifecycle_change.'
      parameters:
      - description: The currency's UUID
        format: uuid
        in: path
        name: hk
        required: true
        type: string
      - description: The delisting
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/delisting.Plan'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
