      - description: Why
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.LiftRestrictionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/restrictions.Restriction'
              type: object
        "400":
