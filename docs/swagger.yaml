      description: Sends a code to a verified contact of the account and, to add or
        replace a contact, a code to the new one. Confirm the change with both codes
        at POST /user/contacts/changes/{id}. A user holds at most one email address
        and one mobile number; the last verified contact cannot be removed.
      parameters:
      - description: The change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.ContactChangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.ContactChangeStarted'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: 'identity_unavailable: the mobile number cannot be checked
            against the national ID now'
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Start a contact change
      tags:
      - user contacts
  /api/v1/user/contacts/changes/{id}:
    post:
      consumes:
      - application/json
      description: Applies the change once both codes are right. For a user with a
        verified national ID, a new mobile number must be registered to it (403 mobile_owner_mismatch),
        and the mobile number cannot be removed (409 mobile_required). A wrong code
        answers 401 code_invalid and names it in info.field; the codes already accepted
        stay accepted, so a retry needs only the others. Codes expire with the change.
      parameters:
      - description: The change_id of the started change
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: The codes
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.ContactChangeConfirmation'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.ContactList'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: 'identity_unavailable: the mobile number cannot be checked
            against the national ID now; the change stays, so confirm it again later'
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Confirm a contact change
      tags:
      - user contacts
  /api/v1/user/favorites:
    get:
      description: 'The favorite currencies and trading pairs of the signed-in user,
        each kind in the user''s order, with the state of each now: a favorite of
        a currency that was later suspended or deleted stays, with that status.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/favorites.List'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: List my favorites
      tags:
      - user favorites
  /api/v1/user/favorites/currencies/{hk}:
    delete:
      description: A repeated remove answers 200 with changed false.
      parameters:
      - description: The currency's hk
        format: uuid
        in: path
        name: hk
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.FavoriteChange'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Remove a favorite currency
      tags:
      - user favorites
    put:
      description: Adds an approved currency at the end of the favorite currencies.
        A repeated add answers 200 with changed false. The favorites of a user, currencies
        and pairs together, are capped by favorites.max_per_user; an add past it answers
        409 favorites_limit_reached, also under concurrent adds on several instances.
      parameters:
      - description: The currency's hk
        format: uuid
        in: path
        name: hk
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.FavoriteChange'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not an approved currency
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Add a favorite currency
      tags:
      - user favorites
  /api/v1/user/favorites/order:
    put:
      consumes:
      - application/json
      description: Sets the order of the favorite currencies, the favorite pairs,
        or both. A kind that is sent names each of its favorites exactly once, or
        the request answers 409 order_mismatch and changes nothing, so that a reorder
        based on a stale list does not drop or keep a favorite by mistake.
      parameters:
      - description: The new order
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.FavoritesOrder'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/favorites.List'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Reorder my favorites
      tags:
      - user favorites
  /api/v1/user/favorites/pairs/{hk}:
    delete:
      parameters:
      - description: The pair's id
        format: uuid
        in: path
        name: hk
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.FavoriteChange'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Remove a favorite trading pair
      tags:
      - user favorites
    put:
      description: Adds an active pair at the end of the favorite pairs, as for currencies.
      parameters:
      - description: The pair's id
        format: uuid
        in: path
        name: hk
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.FavoriteChange'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not an active pair
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Add a favorite trading pair
      tags:
      - user favorites
  /api/v1/user/logout:
    post:
      description: Both routes end the session. POST /api/v1/public/auth/logout exists
        because the refresh token cookie is only sent to /api/v1/public/auth, so only
        that route can clear it in a browser.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Sign out
      tags:
      - sign-in
  /api/v1/user/profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.Profile'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Get the signed-in user's profile
      tags:
      - user
    patch:
      consumes:
      - application/json
      parameters:
      - description: The names to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.profileUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.Profile'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Change the names in the profile
      tags:
      - user
  /api/v1/user/restrictions:
    get:
      description: 'The restrictions that apply now to the signed-in user: the operations
        they block, on every currency or on one, and when they end when that is shown.
        Never the reason. A frozen account cannot sign in, so it is not listed here:
        its requests answer 403 account_frozen. security_hold_until is when the hold
        that follows a change of a contact or of the second factor ends; until then,
        withdrawals answer 403 security_hold.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.RestrictionList'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: List my restrictions
      tags:
      - user
  /api/v1/user/sessions:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.RevokedSessions'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: End every session of the signed-in user but the current one
      tags:
      - user sessions
    get:
      description: The active sessions, newest first, with the session of the request
        marked current. Pages follow the pagination convention of docs/api.md.
      parameters:
      - description: The number of sessions, 50 by default
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - description: The next_cursor of the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/auth.SessionPageDoc'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: List the signed-in user's sessions
      tags:
      - user sessions
  /api/v1/user/sessions/{id}:
    delete:
      parameters:
      - description: The session, from the session list
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: End one of the signed-in user's sessions
      tags:
      - user sessions
  /api/v1/ws/:
    get:
      description: 'Upgrades to a WebSocket. An optional user access token comes as
        Authorization: Bearer, or from a browser as the subprotocols access_token
        and the token. docs/api.md describes the messages.'
      parameters:
      - description: Bearer <access token>
        in: header
        name: Authorization
        type: string
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
        "400":
          description: Not a WebSocket handshake
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Connect to the WebSocket gateway
      tags:
      - websocket
  /system/healthcheck:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/system.HealthStatus'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/system.HealthStatus'
      summary: Readiness, by its earlier name
      tags:
      - system
  /system/live:
    get:
      description: Whether the process serves requests. Checks no dependency.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/system.HealthStatus'
      summary: Liveness
      tags:
      - system
  /system/ping:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PingInfo'
      summary: Ping
      tags:
      - system
  /system/ready:
    get:
      description: '503 while PostgreSQL or Redis is unavailable, or while the instance
        drains at shutdown. Without RabbitMQ it answers 200 with the status degraded:
        only the delivery of sign-in codes needs the broker.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/system.HealthStatus'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/system.HealthStatus'
      summary: Readiness
      tags:
      - system
securityDefinitions:
  BearerAuth:
    description: A user or an admin access token, as "Bearer <token>".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
