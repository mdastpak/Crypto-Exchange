basePath: /
definitions:
  admin.CreateRestrictionRequest:
    properties:
      case_ref:
        description: CaseRef is the reference of the case, at most 64 characters.
        example: AML-2026-0042
        type: string
      currency_hk:
        description: CurrencyHK is the held currency of an asset restriction.
        format: uuid
        type: string
      ends_at:
        description: EndsAt, when set, ends the restriction without a lift.
        type: string
      note:
        description: Note is for administrators, at most 1000 characters.
        type: string
      operations:
        description: |-
          Operations are the blocked operations of an operation or asset
          restriction; an account freeze blocks everything and takes none.
        items:
          $ref: '#/definitions/restrictions.Operation'
          enum:
          - deposit
          - withdraw
          - convert
          - buy
          - sell
          - trade
        type: array
      reason:
        allOf:
        - $ref: '#/definitions/restrictions.Reason'
        enum:
        - court_order
        - aml_review
        - sanctions
        - fraud
        - security
        - user_request
        - other
      scope:
        allOf:
        - $ref: '#/definitions/restrictions.Scope'
        enum:
        - account
        - operation
        - asset
    type: object
  admin.CreatedRestriction:
    properties:
      ended_sessions:
        description: EndedSessions is the number of sessions that a freeze ended.
        example: 2
        type: integer
      restriction:
        $ref: '#/definitions/restrictions.Restriction'
    type: object
  admin.CurrencyPage:
    properties:
      items:
        items:
          $ref: '#/definitions/models.Currency'
        type: array
      next_cursor:
        description: NextCursor asks for the next page. It is left out on the last
          page.
        type: string
    type: object
  admin.LiftRestrictionRequest:
    properties:
      note:
        description: Note says why, for the audit log, at most 1000 characters.
        type: string
    type: object
  admin.RestrictionList:
    properties:
      items:
        items:
          $ref: '#/definitions/restrictions.Restriction'
        type: array
    type: object
  admin.adminSignInRequest:
    properties:
      email:
        type: string
    type: object
  admin.adminVerifyRequest:
    properties:
      otp:
        type: string
      totp:
        type: string
    type: object
  admin.currencyInfoFields:
    properties:
      contract:
        type: string
      en_name:
        type: string
      fa_name:
        type: string
      if_fiat:
        type: boolean
      is_token:
        type: boolean
      symbol:
        type: string
    type: object
  admin.currencyRequest:
    properties:
      info:
        $ref: '#/definitions/admin.currencyInfoFields'
      status:
        type: string
      version:
        description: |-
          Version is the version of the currency that an update is based on.
          When it is sent and the currency has changed since, the update is
          refused with 409. A create may not send it.
        type: integer
    type: object
  audit.Changes:
    properties:
      after:
        additionalProperties: true
        type: object
      before:
        additionalProperties: true
        type: object
    type: object
  audit.Entry:
    properties:
      action:
        example: currency.update
        type: string
      actor_id:
        description: ActorID is the hk of the user or administrator.
        format: uuid
        type: string
      actor_type:
        enum:
        - user
        - admin
        - anonymous
        - system
        type: string
      changes:
        $ref: '#/definitions/audit.Changes'
      hk:
        format: uuid
        type: string
      ip:
        example: 203.0.113.7
        type: string
      occurred_at:
        example: "2026-11-07T10:00:00Z"
        type: string
      outcome:
        enum:
        - success
        - failure
        - denied
        type: string
      reason:
        description: Reason is the code of a failure or a denial.
        example: authenticator_code_invalid
        type: string
      request_id:
        type: string
      target_id:
        type: string
      target_type:
        example: currency
        type: string
      user_agent:
        type: string
    type: object
  audit.EntryPage:
    properties:
      items:
        items:
          $ref: '#/definitions/audit.Entry'
        type: array
      next_cursor:
        description: NextCursor asks for the next page. It is left out on the last
          page.
        type: string
    type: object
  auth.SessionInfo:
    properties:
      auth_method:
        example: otp
        type: string
      created_at:
        type: string
      current:
        description: Current marks the session of the request.
        type: boolean
      expires_at:
        type: string
      id:
        format: uuid
        type: string
      ip:
        example: 203.0.113.7
        type: string
      last_used_at:
        type: string
      user_agent:
        type: string
    type: object
  auth.SessionPageDoc:
    properties:
      items:
        items:
          $ref: '#/definitions/auth.SessionInfo'
        type: array
      next_cursor:
        description: NextCursor asks for the next page. It is left out on the last
          page.
        type: string
    type: object
  models.APIResponse:
    properties:
      code:
        description: |-
          Code names the error of a response of status 400 or more, for
          clients to act on; Message is for people and may change.
        type: string
      info:
        description: Info can hold any type of data (e.g., list or object)
      message:
        type: string
      request_id:
        description: |-
          RequestID is the X-Request-ID of an error response, to quote when
          reporting it.
        type: string
      status:
        type: integer
    type: object
  models.AccessTokenInfo:
    properties:
      access_token:
        example: eyJhbGciOiJSUzI1NiIsImtpZCI6Ii4uLiJ9...
        type: string
    type: object
  models.Currency:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      hk:
        type: string
      id:
        type: integer
      info:
        $ref: '#/definitions/models.CurrencyInfo'
      status:
        type: string
      updated_at:
        type: string
      version:
        description: |-
          Version counts the changes of the currency. Only administrators see
          it; it is 0, and left out, in public responses.
        type: integer
    type: object
  models.CurrencyCreatedInfo:
    properties:
      hk:
        format: uuid
        type: string
      status:
        example: pending
        type: string
      version:
        example: 1
        type: integer
    type: object
  models.CurrencyInfo:
    properties:
      contract:
        type: string
      en_name:
        type: string
      fa_name:
        type: string
      if_fiat:
        type: boolean
      is_token:
        type: boolean
      symbol:
        type: string
    type: object
  models.PingInfo:
    properties:
      message:
        example: pong
        type: string
      timestamp:
        example: "2026-11-07T10:00:00Z"
        type: string
    type: object
  models.SignInCodeInfo:
    properties:
      type:
        description: Type is the kind of contact the code was sent to.
        enum:
        - email
        - mobile
        example: email
        type: string
      username:
        description: Username is the contact, masked.
        example: ali*****@example.com
        type: string
      uuid:
        description: UUID identifies the sign-in session, for the verification.
        format: uuid
        type: string
    type: object
  models.SignInSessionInfo:
    properties:
      uuid:
        description: UUID identifies the sign-in session, for the verification.
        format: uuid
        type: string
    type: object
  models.VersionInfo:
    properties:
      version:
        example: 2
        type: integer
    type: object
  public.OTPRequest:
    properties:
      username:
        type: string
    type: object
  public.ReplaceSessionRequest:
    properties:
      challenge:
        type: string
      session_id:
        description: |-
          SessionID is the session to end, one of the sessions that the
          refusal listed.
        format: uuid
        type: string
    type: object
  public.SessionLimitInfo:
    properties:
      challenge:
        description: Challenge replaces a session with POST /public/auth/sessions/replace.
        type: string
      expires_in:
        description: ExpiresIn is the number of seconds the challenge can be used.
        example: 300
        type: integer
      max_sessions:
        description: MaxSessions is the limit.
        example: 5
        type: integer
      sessions:
        description: Sessions are the active sessions of the user, newest first.
        items:
          $ref: '#/definitions/auth.SessionInfo'
        type: array
    type: object
  public.VerifyOTPRequest:
    properties:
      otp:
        type: string
      uuid:
        type: string
    type: object
  restrictions.Operation:
    enum:
    - deposit
    - withdraw
    - convert
    - buy
    - sell
    - trade
    type: string
    x-enum-varnames:
    - OpDeposit
    - OpWithdraw
    - OpConvert
    - OpBuy
    - OpSell
    - OpTrade
  restrictions.PublicRestriction:
    properties:
      created_at:
        type: string
      currency_hk:
        format: uuid
        type: string
      id:
        format: uuid
        type: string
      operations:
        items:
          $ref: '#/definitions/restrictions.Operation'
        type: array
      scope:
        allOf:
        - $ref: '#/definitions/restrictions.Scope'
        enum:
        - account
        - operation
        - asset
      until:
        description: |-
          Until is when the restriction ends. It is absent when the restriction
          has no end, or its end is not shown.
        type: string
    type: object
  restrictions.Reason:
    enum:
    - court_order
    - aml_review
    - sanctions
    - fraud
    - security
    - user_request
    - other
    type: string
    x-enum-varnames:
    - ReasonCourtOrder
    - ReasonAMLReview
    - ReasonSanctions
    - ReasonFraud
    - ReasonSecurity
    - ReasonUserRequest
    - ReasonOther
  restrictions.Restriction:
    properties:
      active:
        description: |-
          Active is whether the restriction applies now: not lifted, and not
          past its end.
        type: boolean
      case_ref:
        example: AML-2026-0042
        type: string
      created_at:
        type: string
      created_by:
        format: uuid
        type: string
      currency_hk:
        format: uuid
        type: string
      ends_at:
        type: string
      id:
        format: uuid
        type: string
      lift_note:
        type: string
      lifted_at:
        type: string
      lifted_by:
        format: uuid
        type: string
      note:
        type: string
      operations:
        items:
          $ref: '#/definitions/restrictions.Operation'
        type: array
      reason:
        allOf:
        - $ref: '#/definitions/restrictions.Reason'
        example: aml_review
      scope:
        allOf:
        - $ref: '#/definitions/restrictions.Scope'
        enum:
        - account
        - operation
        - asset
      user_hk:
        format: uuid
        type: string
      version:
        example: 1
        type: integer
    type: object
  restrictions.Scope:
    enum:
    - account
    - operation
    - asset
    type: string
    x-enum-varnames:
    - ScopeAccount
    - ScopeOperation
    - ScopeAsset
  system.HealthStatus:
    properties:
      details:
        additionalProperties:
          $ref: '#/definitions/system.ServiceStatus'
        type: object
      status:
        type: string
    type: object
  system.ServiceStatus:
    properties:
      last_check:
        type: string
      latency_ms:
        type: integer
      status:
        type: string
    type: object
  user.Contact:
    properties:
      type:
        example: mobile
        type: string
      value:
        example: 091*****789
        type: string
      verified_at:
        type: string
    type: object
  user.ContactChangeConfirmation:
    properties:
      account_code:
        example: "123456"
        type: string
      new_code:
        example: "654321"
        type: string
    type: object
  user.ContactChangeRequest:
    properties:
      action:
        description: Action is add, replace, or remove.
        enum:
        - add
        - replace
        - remove
        example: add
        type: string
      type:
        description: |-
          Type is the contact to remove. For add and replace, it is taken from
          Value and may be left out.
        enum:
        - email
        - mobile
        example: mobile
        type: string
      value:
        description: Value is the new contact, for add and replace.
        example: "09123456789"
        type: string
      verify_with:
        description: |-
          VerifyWith is the verified contact that receives the code that proves
          the change is the account owner's. By default, the contact that is
          replaced or removed, or for add, the other contact.
        enum:
        - email
        - mobile
        example: email
        type: string
    type: object
  user.ContactChangeStarted:
    properties:
      account_code_sent_to:
        description: |-
          AccountCodeSentTo is the verified contact that received the code of
          account_code.
        example: ali*****@example.com
        type: string
      change_id:
        format: uuid
        type: string
      expires_in:
        description: ExpiresIn is the number of seconds the codes are valid.
        example: 60
        type: integer
      new_code_sent_to:
        description: |-
          NewCodeSentTo is the new contact that received the code of new_code.
          It is left out for a removal.
        example: 091*****789
        type: string
    type: object
  user.ContactList:
    properties:
      items:
        items:
          $ref: '#/definitions/user.Contact'
        type: array
    type: object
  user.Profile:
    properties:
      contact:
        additionalProperties:
          type: string
        type: object
      created_at:
        type: string
      display_name:
        type: string
      first_name:
        type: string
      kyc_status:
        type: string
      kyc_tier:
        type: string
      last_name:
        type: string
      status:
        type: string
      uuid:
        type: string
    type: object
  user.RestrictionList:
    properties:
      items:
        items:
          $ref: '#/definitions/restrictions.PublicRestriction'
        type: array
    type: object
  user.RevokedSessions:
    properties:
      revoked:
        example: 2
        type: integer
    type: object
  user.profileUpdate:
    properties:
      display_name:
        type: string
      first_name:
        type: string
      last_name:
        type: string
    type: object
info:
  contact: {}
  description: 'The HTTP API of the Crypto Exchange server. docs/api.md describes
    the conventions: the envelope, the error codes, sign-in, and the WebSocket messages.
    The unversioned paths of earlier releases still answer, as deprecated aliases
    of the paths under /api/v1.'
  title: Crypto Exchange API
  version: "1"
paths:
  /:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Welcome
      tags:
      - system
  /api/v1/admin/audit:
    get:
      description: The events that the filters select, newest first. Every filter
        is optional, and the filters combine. Pages follow the pagination convention
        of docs/api.md.
      parameters:
      - description: The hk of the user or administrator
        format: uuid
        in: query
        name: actor_id
        type: string
      - description: An action, such as currency.update
        in: query
        name: action
        type: string
      - description: A target type, such as currency
        in: query
        name: target_type
        type: string
      - description: A target id, such as the hk of a currency
        in: query
        name: target_id
        type: string
      - description: The outcome
        enum:
        - success
        - failure
        - denied
        in: query
        name: outcome
        type: string
      - description: Events at or after this time, in RFC 3339
        format: date-time
        in: query
        name: since
        type: string
      - description: Events before this time, in RFC 3339
        format: date-time
        in: query
        name: until
        type: string
      - description: The number of events, 50 by default
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - description: The next_cursor of the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/audit.EntryPage'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Query the audit log
      tags:
      - admin audit
  /api/v1/admin/auth:
    post:
      consumes:
      - application/json
      description: Sends a one-time code to the administrator's email address. The
        answer is the same whether or not the address belongs to an administrator.
      parameters:
      - description: The administrator's email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.adminSignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.SignInSessionInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Request an admin sign-in code
      tags:
      - admin sign-in
  /api/v1/admin/auth/{uuid}:
    post:
      consumes:
      - application/json
      description: Checks the emailed code and the authenticator (TOTP) code, and
        returns an admin access token.
      parameters:
      - description: The sign-in session from the code request
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: The emailed code and the authenticator code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.adminVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.AccessTokenInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Verify an admin sign-in
      tags:
      - admin sign-in
  /api/v1/admin/currencies:
    get:
      description: Every currency, whatever its status, deleted ones included, newest
        first, with its version. Read from the database, not the public cache. The
        filters are optional and combine. Pages follow the pagination convention of
        docs/api.md.
      parameters:
      - description: The status
        enum:
        - approved
        - pending
        - suspend
        - deleted
        in: query
        name: status
        type: string
      - description: The symbol, in any case
        in: query
        name: symbol
        type: string
      - description: Only tokens, or only currencies that are not
        in: query
        name: is_token
        type: boolean
      - description: Only fiat currencies, or only those that are not
        in: query
        name: if_fiat
        type: boolean
      - description: The number of currencies, 50 by default
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - description: The next_cursor of the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/admin.CurrencyPage'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: List currencies
      tags:
      - admin currencies
    post:
      consumes:
      - application/json
      parameters:
      - description: The currency
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.currencyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.CurrencyCreatedInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Create a currency
      tags:
      - admin currencies
  /api/v1/admin/currencies/{hk}:
    delete:
      description: Soft-deletes the currency. With version, the delete is refused
        with 409 version_conflict when the currency has changed since.
      parameters:
      - description: The currency's UUID
        format: uuid
        in: path
        name: hk
        required: true
        type: string
      - description: The version the delete is based on
        in: query
        minimum: 1
        name: version
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.VersionInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete a currency
      tags:
      - admin currencies
    get:
      description: Whatever its status, deleted ones included.
      parameters:
      - description: The currency's UUID
        format: uuid
        in: path
        name: hk
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.Currency'
              type: object
        "400":
          description: Bad Request
          schema:
