          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: market_asset_not_found or market_pair_not_found
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Get the chart of an asset at an exchange
      tags:
      - market data
  /api/v1/market-data/assets/{slug}/venues:
    get:
      description: 'The latest ticker of the asset on each enabled venue of the regions
        this release shows, by quote, with the flags of its quality: stale past the
        staleness limit, and outlier when further from the median of the venues than
        the configured share. Prices in different quotes are never compared.'
      parameters:
      - description: The slug of the asset, such as bitcoin
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
