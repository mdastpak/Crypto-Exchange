        allOf:
        - $ref: '#/definitions/restrictions.Reason'
        example: aml_review
      scope:
        allOf:
        - $ref: '#/definitions/restrictions.Scope'
        enum:
        - account
        - operation
        - asset
      user_hk:
        format: uuid
        type: string
      version:
        example: 1
        type: integer
    type: object
  restrictions.Scope:
    enum:
    - account
    - operation
    - asset
    type: string
    x-enum-varnames:
    - ScopeAccount
    - ScopeOperation
    - ScopeAsset
  rowseal.Finding:
    properties:
      check:
        enum:
        - missing
        - mismatch
        - unknown_key
        - row_missing
        type: string
      detected_at:
        type: string
      detected_by:
        enum:
        - read
        - verifier
        type: string
      id:
        type: integer
      last_seen_at:
        type: string
      reason:
        type: string
      reseal_request_reason:
        type: string
      reseal_requested_at:
        type: string
      reseal_requested_by:
        description: |-
          ResealRequestedBy is the administrator who asked for the re-seal that
          another administrator must approve (#308), with when and why.
        type: string
      resolution:
        enum:
        - resealed
        - report_mode
        - row_gone
        type: string
      resolved_at:
        type: string
      resolved_by:
        type: string
      row_key:
        type: string
      seen_count:
        type: integer
      table:
        type: string
    type: object
  sites.Alternate:
    properties:
      hreflang:
        example: fa-IR
        type: string
      locale:
        example: fa
        type: string
      site:
        example: ir
        type: string
      url:
        example: https://example.ir/markets
        type: string
    type: object
  sites.Site:
    properties:
      countries:
        description: |-
          Countries are the ISO 3166-1 alpha-2 codes of the countries it
          serves; empty for a site that serves the rest of the world.
        items:
          type: string
        type: array
      default_locale:
        description: DefaultLocale is the first of Locales.
        example: fa
        type: string
      domain:
        description: Domain is its canonical host, such as "example.ir".
        example: example.ir
        type: string
      enforce:
        description: |-
          Enforce keeps the visitors of its countries on it, whatever they
          chose, for a legal requirement.
        type: boolean
      id:
        description: ID names the site, such as "global" or "ir".
        example: ir
        type: string
      locales:
        description: Locales are the codes of its locales; the first is its default.
        example:
        - fa
        - en
        items:
          type: string
        type: array
      url:
        description: URL is the origin of the site, such as "https://example.ir".
        example: https://example.ir
        type: string
    type: object
  system.HealthStatus:
    properties:
      details:
        additionalProperties:
          $ref: '#/definitions/system.ServiceStatus'
        type: object
      status:
        type: string
    type: object
  system.ServiceStatus:
    properties:
      last_check:
        type: string
      latency_ms:
        type: integer
      status:
        type: string
    type: object
  user.AddPasskeyRequest:
    properties:
      credential:
        description: |-
          Credential is the answer of navigator.credentials.create to the
          options of POST /user/passkey-registration.
        type: object
      name:
        description: Name is what the user calls the passkey, such as the device.
        example: iPhone
        type: string
    type: object
  user.Contact:
    properties:
      type:
        example: mobile
        type: string
      value:
        example: 091*****789
        type: string
      verified_at:
        type: string
    type: object
  user.ContactChangeConfirmation:
    properties:
      account_code:
        example: "123456"
        type: string
      new_code:
        example: "654321"
        type: string
    type: object
  user.ContactChangeRequest:
    properties:
      action:
        description: Action is add, replace, or remove.
        enum:
        - add
        - replace
        - remove
        example: add
        type: string
      type:
        description: |-
          Type is the contact to remove. For add and replace, it is taken from
          Value and may be left out.
        enum:
        - email
        - mobile
        example: mobile
        type: string
      value:
        description: Value is the new contact, for add and replace.
        example: "09123456789"
        type: string
      verify_with:
        description: |-
          VerifyWith is the verified contact that receives the code that proves
          the change is the account owner's. By default, the contact that is
          replaced or removed, or for add, the other contact.
        enum:
        - email
        - mobile
        example: email
        type: string
    type: object
  user.ContactChangeStarted:
    properties:
      account_code_sent_to:
        description: |-
          AccountCodeSentTo is the verified contact that received the code of
          account_code.
        example: ali*****@example.com
        type: string
      change_id:
        format: uuid
        type: string
      expires_in:
        description: ExpiresIn is the number of seconds the codes are valid.
        example: 60
        type: integer
      new_code_sent_to:
        description: |-
          NewCodeSentTo is the new contact that received the code of new_code.
          It is left out for a removal.
        example: 091*****789
        type: string
    type: object
  user.ContactList:
    properties:
      items:
        items:
          $ref: '#/definitions/user.Contact'
        type: array
    type: object
  user.FavoriteChange:
    properties:
      changed:
        description: Changed is false when the favorite already was, or was not, there.
        type: boolean
    type: object
  user.FavoritesOrder:
    properties:
      currencies:
        items:
          type: string
        type: array
      pairs:
        items:
          type: string
        type: array
    type: object
  user.PasskeyAdded:
    properties:
      passkey:
        $ref: '#/definitions/passkey.Passkey'
      security_hold_until:
        description: SecurityHoldUntil is when the security hold on withdrawals ends.
        type: string
    type: object
  user.PasskeyList:
    properties:
      max:
        description: Max is how many passkeys an account can have.
        example: 10
        type: integer
      passkeys:
        items:
          $ref: '#/definitions/passkey.Passkey'
        type: array
    type: object
  user.PasswordChanged:
    properties:
      password:
        $ref: '#/definitions/userauth.Status'
      recovery_codes:
        description: |-
          RecoveryCodes come with the first password, once: ten single-use
          codes, one of which resets a forgotten password. They are not
          stored, so the user must keep them.
        items:
          type: string
        type: array
      security_hold_until:
        description: |-
          SecurityHoldUntil is until when withdrawals are held after this
          change of the second factor.
        type: string
      sessions_ended:
        description: SessionsEnded is how many other sessions the change ended.
        example: 1
        type: integer
    type: object
  user.Profile:
    properties:
      contact:
        additionalProperties:
          type: string
        type: object
      created_at:
        type: string
      display_name:
        type: string
      first_name:
        type: string
      kyc_status:
        type: string
      kyc_tier:
        type: string
      last_name:
        type: string
      locale:
        description: |-
          Locale is the language the user chose (#286), a tag of GET
          /public/locales, or null for none: each request then negotiates it.
          It applies to every signed-in request that names no locale itself.
        example: fa
        type: string
      status:
        type: string
      theme:
        description: |-
          Theme is the colour theme for the frontends: light, dark, or system,
          which follows the device.
        enum:
        - light
        - dark
        - system
        example: system
        type: string
      uuid:
        type: string
    type: object
  user.RecoveryCodes:
    properties:
      recovery_codes:
        description: RecoveryCodes are ten single-use codes. They are shown once.
        items:
          type: string
        type: array
    type: object
  user.RestrictionList:
    properties:
      items:
        items:
          $ref: '#/definitions/restrictions.PublicRestriction'
        type: array
      security_hold_until:
        description: |-
          SecurityHoldUntil is when the security hold ends (#251): after a
          change of a contact or of the second factor, withdrawals and the
          other operations that a second factor protects answer 403
          security_hold until then. It is absent when no hold applies.
        type: string
    type: object
  user.RevokedSessions:
    properties:
      revoked:
        example: 2
        type: integer
    type: object
  user.SecuritySettings:
    properties:
      passkeys:
        description: |-
          Passkeys is how many passkeys the user has, and PasskeysAvailable
          whether this deployment offers them.
        example: 1
        type: integer
      passkeys_available:
        type: boolean
      password:
        allOf:
        - $ref: '#/definitions/userauth.Status'
        description: Password is the account password, the second step of the sign-in.
      password_min_length:
        description: |-
          PasswordMinLength is the least length of a new password, in
          characters.
        example: 10
        type: integer
      recovery:
        allOf:
        - $ref: '#/definitions/userauth.Recovery'
        description: |-
          Recovery is the account recovery in progress, if any: someone
          proved the contacts of the account to replace its password. Proving
          the password, as POST /user/step-up does, cancels it.
      recovery_codes_left:
        description: RecoveryCodesLeft is how many unused recovery codes the user
          has.
        example: 10
        type: integer
      second_factor:
        allOf:
        - $ref: '#/definitions/userauth.State'
        description: SecondFactor is where this session stands with the second factor.
      totp_enabled:
        description: |-
          TOTPEnabled is whether the user has an authenticator app, which
          proves the second step instead of the password.
        type: boolean
    type: object
  user.SetPasswordRequest:
    properties:
      current_password:
        description: |-
          CurrentPassword is required to change a password, and left out to
          set the first one.
        type: string
      new_password:
        type: string
    type: object
  user.StepUpRequest:
    properties:
      passkey:
        description: |-
          Passkey is the answer of the device to the options of
          POST /user/step-up/passkey. It replaces the two above.
        type: object
      password:
        description: |-
          Password is the account password. Exactly one of Password and
          TOTPCode is sent.
        type: string
      totp_code:
        description: TOTPCode is a code of the authenticator app of a user who has
          one.
        example: "123456"
        type: string
    type: object
  user.SteppedUp:
    properties:
      elevated_until:
        description: |-
          ElevatedUntil is until when the session may run the operations that
          the second factor protects.
        type: string
    type: object
  user.TOTPChanged:
    properties:
      security_hold_until:
        description: SecurityHoldUntil is when the security hold on withdrawals ends.
        type: string
    type: object
  user.TOTPCodeRequest:
    properties:
      code:
        example: "123456"
        type: string
    type: object
  user.profileUpdate:
    properties:
      display_name:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      locale:
        description: |-
          Locale is a tag of GET /public/locales, or "" to clear the choice
          (#286).
        example: fa
        type: string
      theme:
        description: Theme is light, dark, or system.
        enum:
        - light
        - dark
        - system
        example: dark
        type: string
    type: object
  userauth.Recovery:
    properties:
      contacts_proven:
        example: 2
        type: integer
      contacts_required:
        description: |-
          ContactsRequired and ContactsProven count the verified email
          addresses and mobile numbers of the account, and those of them that
          the recovery proved.
        example: 2
        type: integer
      expires_at:
        description: ExpiresAt is when the recovery stops being usable.
        type: string
      id:
        type: string
      identity_attempts_left:
        description: IdentityAttemptsLeft is how many identity checks may still fail.
        example: 3
        type: integer
      mode:
        description: Mode is "standard" or "strict".
        example: standard
        type: string
      ready_at:
        description: ReadyAt is when the wait ends and the new password can be set.
        type: string
      started_at:
        type: string
      status:
        description: |-
          Status is "verifying" while there is more to prove, and "waiting"
          once everything is proved.
        example: waiting
        type: string
      steps_remaining:
        items:
          type: string
        type: array
      steps_required:
        description: |-
          StepsRequired are the identity steps; StepsRemaining those that
          have not passed.
        items:
          type: string
        type: array
    type: object
  userauth.State:
    properties:
      elevated_until:
        description: |-
          ElevatedUntil is until when the session may run the protected
          operations without proving the factor again. It is left out when
          the session is not elevated.
        type: string
      enrolled:
        description: Enrolled reports whether the user has a second factor.
        type: boolean
      mode:
        description: Mode is security.second_factor.mode.
        enum:
        - optional
        - required_for_funds
        example: required_for_funds
        type: string
    type: object
  userauth.Status:
    properties:
      changed_at:
        description: ChangedAt is when it was set or last changed.
        type: string
      set:
        description: Set reports whether the account has a password.
        type: boolean
    type: object
  userauth.TOTPEnrollment:
    properties:
      secret:
        description: Secret is the secret in base32, for apps that cannot scan.
        example: JBSWY3DPEHPK3PXP
        type: string
      uri:
        description: URI is the otpauth URI, which the client shows as a QR code.
        example: otpauth://totp/Exchange:user?secret=JBSWY3DPEHPK3PXP&issuer=Exchange
        type: string
    type: object
info:
  contact: {}
  description: 'The HTTP API of the Crypto Exchange server. docs/api.md describes
    the conventions: the envelope, the error codes, sign-in, and the WebSocket messages.
    Every route is under /api/v1, besides the health probes /system/live and /system/ready.'
  title: Crypto Exchange API
  version: "1"
paths:
  /api/v1/admin/audit:
    get:
      description: The events that the filters select, newest first. Every filter
        is optional, and the filters combine. Pages follow the pagination convention
        of docs/api.md.
      parameters:
      - description: The hk of the user or administrator
        format: uuid
        in: query
        name: actor_id
        type: string
      - description: An action, such as currency.update
        in: query
        name: action
        type: string
      - description: A target type, such as currency
        in: query
        name: target_type
        type: string
      - description: A target id, such as the hk of a currency
        in: query
        name: target_id
        type: string
      - description: The outcome
        enum:
        - success
        - failure
        - denied
        in: query
        name: outcome
        type: string
      - description: Events at or after this time, in RFC 3339
        format: date-time
        in: query
        name: since
        type: string
      - description: Events before this time, in RFC 3339
        format: date-time
        in: query
        name: until
        type: string
      - description: The number of events, 50 by default
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - description: The next_cursor of the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/audit.EntryPage'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Query the audit log
      tags:
      - admin audit
  /api/v1/admin/auth:
    post:
      consumes:
      - application/json
      description: Sends a one-time code to the administrator's email address. The
        answer is the same whether or not the address belongs to an administrator.
      parameters:
      - description: The administrator's email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.adminSignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.SignInSessionInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Request an admin sign-in code
      tags:
      - admin sign-in
  /api/v1/admin/auth/{uuid}:
    post:
      consumes:
      - application/json
      description: Checks the emailed code and the authenticator (TOTP) code, and
        returns an admin access token.
      parameters:
      - description: The sign-in session from the code request
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: The emailed code and the authenticator code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.adminVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.AccessTokenInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Verify an admin sign-in
      tags:
      - admin sign-in
  /api/v1/admin/currencies:
    get:
      description: Every currency, whatever its status, deleted ones included, newest
        first by default, with its version. Read from the database, not the public
        cache. The filters are those of GET /public/currencies, plus status; they
        are optional and combine, and an unknown parameter is refused. Pages follow
        the pagination convention of docs/api.md.
      parameters:
      - collectionFormat: csv
        description: Statuses, repeated or comma-separated
        in: query
        items:
          enum:
          - approved
          - pending
          - suspend
          - deleted
          type: string
        name: status
        type: array
      - description: Text in the symbol, English name, or Persian name, normalized;
          symbols that match it come first
        in: query
        maxLength: 64
        name: q
        type: string
      - collectionFormat: csv
        description: Symbols, in any case, repeated or comma-separated
        in: query
        items:
          type: string
        name: symbol
        type: array
      - description: Text in the English name, in any case
        in: query
        maxLength: 64
        name: en_name
        type: string
      - description: Text in the Persian name, with Arabic letters and Persian or
          Arabic digits matching the Persian ones
        in: query
        maxLength: 64
        name: fa_name
        type: string
      - description: The contract address, in any case
        in: query
        maxLength: 128
        name: contract
        type: string
      - description: Only currencies with a contract, or only those without
        in: query
        name: has_contract
        type: boolean
      - description: Only tokens, or only currencies that are not
        in: query
        name: is_token
        type: boolean
      - description: Only fiat currencies, or only those that are not
        in: query
        name: if_fiat
        type: boolean
      - description: Created at or after this RFC 3339 time
        format: date-time
        in: query
        name: created_since
        type: string
      - description: Created before this RFC 3339 time
        format: date-time
        in: query
        name: created_until
        type: string
      - description: Updated at or after this RFC 3339 time
        format: date-time
        in: query
        name: updated_since
        type: string
      - description: The order, with - for descending; the hk breaks ties
        enum:
        - symbol
        - -symbol
        - en_name
        - -en_name
        - created_at
        - -created_at
        - updated_at
        - -updated_at
        in: query
        name: sort
        type: string
      - description: The number of currencies, 50 by default
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - description: The next_cursor of the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/admin.CurrencyPage'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: List currencies
      tags:
      - admin currencies
    post:
      consumes:
      - application/json
      parameters:
      - description: The currency
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.currencyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.CurrencyCreatedInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Create a currency
      tags:
      - admin currencies
  /api/v1/admin/currencies/{hk}:
    delete:
      description: Soft-deletes the currency. With version, the delete is refused
        with 409 version_conflict when the currency has changed since.
      parameters:
      - description: The currency's UUID
        format: uuid
        in: path
        name: hk
        required: true
        type: string
      - description: The version the delete is based on
        in: query
        minimum: 1
        name: version
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.VersionInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
