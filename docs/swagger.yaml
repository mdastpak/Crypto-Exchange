                  $ref: '#/definitions/marketdata.VenueComparison'
              type: object
        "304":
          description: 'Not modified: the If-None-Match matches'
        "404":
          description: market_asset_not_found
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Compare the prices of an asset across exchanges
      tags:
      - market data
  /api/v1/market-data/feed/assets:
    get:
      description: The assets of the catalog in the order they last changed, for a
        service that keeps a copy, such as the blog. Start with updated_since, or
        from the beginning, then follow next_cursor, which every page has; keep the
        last one and ask with it later. An asset is listed again each time it changes,
        with all its fields; one that an administrator hid is listed as removed. An
        asset appears once its change is a minute old, so that no change is missed.
        Cached for market_data.api.cache_seconds, with an ETag.
      parameters:
      - description: The first change to list, RFC 3339; ignored with a cursor
        format: date-time
        in: query
        name: updated_since
        type: string
      - description: The number of assets, 50 by default
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - description: The next_cursor of the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/marketdata.FeedPage'
              type: object
        "304":
          description: 'Not modified: the If-None-Match matches'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Follow the changes of the market data catalog
      tags:
      - market data
  /api/v1/public/auth:
    post:
      consumes:
      - application/json
      description: Sends a one-time code to an email address or a mobile number. Limited
        per hour and client address.
      parameters:
      - description: The email address or mobile number to send the code to
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/public.OTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.SignInCodeInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Request a sign-in code
      tags:
      - sign-in
  /api/v1/public/auth/{uuid}:
    post:
      consumes:
      - application/json
      description: Returns an access token, and sets the refresh token in the HttpOnly
        refresh_token cookie.
      parameters:
      - description: The sign-in session from the code request
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: The code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/public.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.AccessTokenInfo'
              type: object
        "202":
          description: 'The code is right and the account has a second step: no token,
            and a challenge for POST /public/auth/second-step'
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/public.SecondStepInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: 'session_limit_reached: the user has the most active sessions
            allowed'
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/public.SessionLimitInfo'
              type: object
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: 'identity_unavailable: the mobile number is due for a check
            against the national ID of its account, and the provider cannot answer
            now'
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Verify a sign-in code
      tags:
      - sign-in
  /api/v1/public/auth/logout:
    post:
      description: Both routes end the session. POST /api/v1/public/auth/logout exists
        because the refresh token cookie is only sent to /api/v1/public/auth, so only
        that route can clear it in a browser.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Sign out
      tags:
      - sign-in
  /api/v1/public/auth/password-reset:
    post:
      consumes:
      - application/json
      description: 'A user who forgot the account password proves the account twice:
        with the code sent to a contact, which answered 202 with a challenge, and
        with one of the recovery codes, or with a code of the authenticator app (totp_code)
        for an account whose password_reset lists totp, or with a passkey (passkey)
        for one that lists passkey. The new password follows the policy of PUT /user/password.
        The recovery code is used up, every session of the user ends, the security
        hold starts, and the answer signs in. A wrong recovery code answers 401 recovery_code_invalid,
        leaves the challenge usable, and counts toward the lock of the password: 429
        password_locked with Retry-After. An account without unused recovery codes
        needs account recovery.'
      parameters:
      - description: The challenge, a recovery code, and the new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/public.PasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The access token. The refresh token is set as an HttpOnly cookie.
          headers:
            Set-Cookie:
              description: The refresh token, HttpOnly
              type: string
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.AccessTokenInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: challenge_invalid, recovery_code_invalid, totp_invalid, or
            passkey_invalid
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "429":
          description: password_locked, or a rate limit
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Reset a forgotten account password
      tags:
      - sign-in
  /api/v1/public/auth/recovery:
    post:
      consumes:
      - application/json
      description: 'For a user who has neither the account password nor a recovery
        code. A correct code answered 202 with a challenge; sent here, it proves the
        contact of that code. The recovery needs every verified email address and
        mobile number of the account, so the user signs in with each in turn and sends
        each challenge here. With security.recovery.mode strict, an account with a
        verified national ID also passes the steps of security.recovery.steps: national_id,
        the national ID sent in this request, and mobile_ownership, the provider''s
        confirmation that a proved mobile number belongs to that national ID. A failed
        identity check answers 401 recovery_identity_mismatch; the third one ends
        the recovery with 403 recovery_failed, and the account can start another after
        24 hours: 429 recovery_cooldown. When everything is proved the recovery is
        waiting, and after security.recovery.wait_hours POST /public/auth/recovery/complete
        sets the new password. Proving the account password anywhere cancels the recovery.
        A recovery has 24 hours to prove everything.'
      parameters:
      - description: The challenge, and the national ID for a strict recovery
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/public.RecoveryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The state of the recovery
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/userauth.Recovery'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: challenge_invalid, recovery_contact_invalid, or recovery_identity_mismatch
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/userauth.Recovery'
              type: object
        "403":
          description: recovery_failed, or the account cannot sign in
          schema:
            $ref: '#/definitions/models.APIResponse'
        "429":
          description: recovery_cooldown, or a rate limit
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: 'recovery_unavailable: an identity check cannot run now'
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Start or continue an account recovery
      tags:
      - sign-in
  /api/v1/public/auth/recovery/complete:
    post:
      consumes:
      - application/json
      description: 'Completes an account recovery whose wait has ended. The challenge
        comes from a correct code of a contact that the recovery proved. The new password
        follows the policy of PUT /user/password. Every session of the user ends,
        the earlier recovery codes stop working and new ones are returned once, and
        the security hold starts. The answer does not sign in: the user signs in with
        a code and the new password. Before the wait ends the answer is 409 recovery_not_ready
        with Retry-After.'
      parameters:
      - description: The challenge and the new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/public.RecoveryCompleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/public.RecoveryCompleteInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: challenge_invalid or recovery_contact_invalid
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: recovery_not_found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: recovery_not_ready
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Set a new password with a recovery
      tags:
      - sign-in
  /api/v1/public/auth/refresh:
    post:
      description: Exchanges the refresh_token cookie for a new access token, and
        rotates the cookie. A rotated refresh token that is presented again revokes
        the session, except within jwt.refresh_token.reuse_grace_seconds of its rotation,
        when it gets a new access token and no new cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.AccessTokenInfo'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Refresh the access token
      tags:
      - sign-in
  /api/v1/public/auth/second-step:
    post:
      consumes:
      - application/json
      description: 'After a correct code answered 202 with a challenge, the account
        password signs in, or a code of the authenticator app (totp_code) for an account
        whose methods list totp: 401 totp_invalid for a wrong or used code, 429 totp_locked
        after too many. An account whose methods list passkey can send, as passkey,
        the answer of the device to the options of POST /public/auth/second-step/passkey:
        401 passkey_invalid when it proves nothing. The challenge works for five minutes,
        until a sign-in succeeds with it. A wrong password answers 401 password_invalid
        and leaves the challenge usable; after security.password.max_failures wrong
        passwords in a row the password is locked for security.password.lock_minutes,
        on every instance, and the answer is 429 password_locked with Retry-After.'
      parameters:
      - description: The challenge and the password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/public.SecondStepRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The access token. The refresh token is set as an HttpOnly cookie.
          headers:
            Set-Cookie:
              description: The refresh token, HttpOnly
              type: string
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.AccessTokenInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: challenge_invalid, password_invalid, totp_invalid, or passkey_invalid
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: 'session_limit_reached: the user has the most active sessions
            allowed'
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/public.SessionLimitInfo'
              type: object
        "429":
          description: password_locked, or a rate limit
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Finish a sign-in with the account password
      tags:
      - sign-in
  /api/v1/public/auth/second-step/passkey:
    post:
      consumes:
      - application/json
      description: 'For an account whose methods list passkey: answers the options
        for navigator.credentials.get, bound to the challenge of the sign-in. The
        answer of the device goes, as passkey, to POST /public/auth/second-step or
        POST /public/auth/password-reset within five minutes, once. The device must
        verify its holder, with a biometric or a PIN.'
      parameters:
      - description: The challenge
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/public.PasskeyOptionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The options, under publicKey
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/passkey.Options'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: challenge_invalid
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: 'passkey_not_found: the account has no passkey'
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: 'passkey_unavailable: passkeys are not configured'
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Get the options of a passkey proof for a sign-in
      tags:
      - sign-in
  /api/v1/public/auth/sessions/replace:
    post:
      consumes:
      - application/json
      description: After a sign-in answered 409 session_limit_reached, ends one of
        the listed sessions and signs in, without a new code. The challenge works
        once, for five minutes. A session_id that is not one of the user's active
        sessions answers 409 session_not_found and leaves the challenge usable.
      parameters:
      - description: The challenge and the session to end
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/public.ReplaceSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The access token. The refresh token is set as an HttpOnly cookie.
          headers:
            Set-Cookie:
              description: The refresh token, HttpOnly
              type: string
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.AccessTokenInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: session_not_found, or session_limit_reached with a new challenge
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/public.SessionLimitInfo'
              type: object
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: End a session to sign in past the session limit
      tags:
      - sign-in
  /api/v1/public/currencies:
    get:
      description: The approved currencies, oldest first by default, a page at a time.
        The filters are optional and combine, and an unknown parameter is refused
        with 400 validation_failed. Text filters ignore case, and match Persian text
        typed with Arabic letters, Persian or Arabic digits, or a zero-width non-joiner.
        With q and no sort, the currencies whose symbol is q, then those whose symbol
        starts with it, come first. Every instance answers the same, from the shared
        cache or from the database.
      parameters:
      - description: Text in the symbol, English name, or Persian name, normalized;
          symbols that match it come first
        in: query
        maxLength: 64
        name: q
        type: string
      - collectionFormat: csv
        description: Symbols, in any case, repeated or comma-separated
        in: query
        items:
          type: string
        name: symbol
        type: array
      - description: Text in the English name, in any case
        in: query
        maxLength: 64
        name: en_name
        type: string
      - description: Text in the Persian name, with Arabic letters and Persian or
          Arabic digits matching the Persian ones
        in: query
        maxLength: 64
        name: fa_name
        type: string
      - description: The contract address, in any case
        in: query
        maxLength: 128
        name: contract
        type: string
      - description: Only currencies with a contract, or only those without
        in: query
        name: has_contract
        type: boolean
      - description: Only tokens, or only currencies that are not
        in: query
        name: is_token
        type: boolean
      - description: Only fiat currencies, or only those that are not
        in: query
        name: if_fiat
        type: boolean
      - description: Created at or after this RFC 3339 time
        format: date-time
        in: query
        name: created_since
        type: string
      - description: Created before this RFC 3339 time
        format: date-time
        in: query
        name: created_until
        type: string
      - description: Updated at or after this RFC 3339 time
        format: date-time
        in: query
        name: updated_since
        type: string
      - description: 'true: only the favorites of the signed-in user, which needs
          their access token'
        in: query
        name: favorites
        type: boolean
      - description: The order, with - for descending; the hk breaks ties
        enum:
        - symbol
        - -symbol
        - en_name
        - -en_name
        - created_at
        - -created_at
        - updated_at
        - -updated_at
        in: query
        name: sort
        type: string
      - description: The number of currencies, 50 by default
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - description: The next_cursor of the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/public.CurrencyPage'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: favorites=true without a valid user access token
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: List the public currencies
      tags:
      - currencies
  /api/v1/public/currencies/{hk}:
    get:
      parameters:
      - description: The currency's UUID
        format: uuid
        in: path
        name: hk
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.Currency'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Get a public currency
      tags:
      - currencies
  /api/v1/public/locales:
    get:
      description: 'The locales the product supports, each with its names and its
        direction (ltr or rtl), the default, and the locale this request negotiated:
        from the lang query parameter, the X-Locale header, the locale cookie, Accept-Language,
        or the default, in that order (#283). Frontends build the language switcher
        from it and set lang and dir on the root element from current.'
      parameters:
      - description: A locale for this request, such as fa
        in: query
        name: lang
        type: string
      - description: The locale an app chose
        in: header
        name: X-Locale
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/public.LocalesInfo'
              type: object
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: List the supported languages and their text direction
      tags:
      - system
  /api/v1/public/site:
    get:
      description: The visitor's country (GeoIP), the site they are on (by the Origin
        of the call, X-Forwarded-Host through a trusted proxy, or Host), the site
        they belong to and why, the locale to show with its direction, whether to
        redirect and where, every site for a switcher, and the alternates of the page
        for hreflang links (#285). A site that enforces the visitor's country comes
        first; then a crawler stays where it is; then the site the visitor picked
        (site cookie); then the site they are on when they chose a locale it offers;
        then the site of their country; then the default site. The locale is the one
        the visitor or their browser asked for when the site offers it, else the site's
        default.
      parameters:
      - default: /
        description: The page, a local path such as /markets?tab=spot
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/public.SiteInfo'
              type: object
        "400":
          description: invalid_path
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Show the site and locale the visitor belongs to
      tags:
      - system
  /api/v1/public/site/choice:
    post:
      consumes:
      - application/json
      description: Saves the visitor's explicit choice as the site and locale cookies
        of the API's host, for a year, so that GeoIP no longer moves them, except
        to a site that enforces their country (#285). An empty value clears that cookie.
        Answers what GET /public/site answers after the choice, for the root page.
      parameters:
      - description: The site and locale
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/public.SiteChoice'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/public.SiteChoice'
              type: object
        "400":
          description: invalid_request, unknown_site, or unknown_locale
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Save the site and locale the visitor picked
      tags:
      - system
  /api/v1/public/site/redirect:
    get:
      description: 302 to the same page on the site the visitor belongs to, chosen
        as GET /public/site chooses it, or 204 when they are already on it, or when
        there are no sites (#285). Frontends, or an edge function, call it on the
        first page view. Only the configured domains are ever targets, and crawlers
        are never redirected.
      parameters:
      - default: /
        description: The page, a local path such as /markets
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: The visitor is on their site
        "302":
          description: To the visitor's site; Location names the page there
        "400":
          description: invalid_path
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Redirect the visitor to their site
      tags:
      - system
  /api/v1/public/status:
    get:
      description: Whether the exchange is open or under maintenance, the features
        that are locked now, and the maintenances and lockdowns that are announced,
        with their messages in Persian and English, for the apps to show a banner
        or a countdown (#235). It answers during a maintenance too, from the memory
        of the instance, so it never needs the database. Over the WebSocket, every
        connection receives the same status as a platform.status event when it changes.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/platform.Status'
              type: object
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Show the status of the exchange
      tags:
      - system
