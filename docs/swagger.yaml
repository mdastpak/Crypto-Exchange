      description: Ends a restriction now. A lifted freeze lets the user sign in again;
        the sessions it ended stay ended. With version, the lift is refused with 409
        version_conflict when the restriction has changed since. A lifted restriction
        answers 409 already_lifted. Audited as user.restriction_lift.
      parameters:
      - description: The user's UUID
        format: uuid
        in: path
        name: hk
        required: true
