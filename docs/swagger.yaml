          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/rowseal.Finding'
              type: object
        "202":
          description: Accepted
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
