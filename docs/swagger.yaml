      description: 'Schedules a rebrand, a redenomination, or a merger that moves
        the holders of one or more approved source currencies to this approved target,
        each source at its ratio: the units of the target that one unit of the source
        becomes, such as 0.01 for 100 LEND = 1 AAVE. The phases follow the order announced,
        deposits_paused, trading_halted, converting, completed; announced and completed
        are required. A forced migration pauses the deposits and withdrawals of its
        sources at deposits_paused, halts their trading and conversions at trading_halted,
        and retires them from the lists at completed; an optional one only offers
        the conversion, and its sources stay. Each phase applies at its time, exactly
        once, on any instance. From announced on, the sources show the migration.
        Conversions round down to the precision of the target and record the dust;
        they are carried out by the ledger. Audited as currency.migration_schedule,
        and each phase as currency.migration_phase.'
