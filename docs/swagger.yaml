        the instance has not applied yet.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/admin.PlatformOverview'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
