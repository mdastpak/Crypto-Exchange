      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PingInfo'
      summary: Ping
      tags:
      - system
  /system/ready:
    get:
      description: 503 while PostgreSQL, Redis, or RabbitMQ is unavailable, or while
        the instance drains at shutdown.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/system.HealthStatus'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/system.HealthStatus'
      summary: Readiness
      tags:
      - system
securityDefinitions:
  BearerAuth:
    description: A user or an admin access token, as "Bearer <token>".
    in: header
    name: Authorization
    type: apiKey
