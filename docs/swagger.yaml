  /api/v1/user/passkey-registration:
    post:
      description: 'Answers the options for navigator.credentials.create: a passkey
        of the device, such as Face ID, a fingerprint, Windows Hello, or a security
        key. The device must verify its holder. The answer of the device goes to POST
        /user/passkeys within five minutes. A passkey comes after the account password,
        409 second_factor_not_set without one, and needs a fresh proof of the second
        factor: 403 step_up_required.'
      produces:
      - application/json
      responses:
        "200":
          description: The options, under publicKey
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/passkey.Options'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: step_up_required
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: second_factor_not_set or passkey_limit_reached
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: 'passkey_unavailable: passkeys are not configured'
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Start adding a passkey
      tags:
      - user-security
  /api/v1/user/passkeys:
    get:
      description: The passkeys of the user, oldest first, without their keys. A passkey
        whose row was changed outside the backend is left out, and proves nothing.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.PasskeyList'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: List the passkeys of the signed-in user
      tags:
      - user-security
    post:
      consumes:
      - application/json
      description: 'Checks the answer of the device to the options of POST /user/passkey-registration
        and adds the passkey. From then on the user can prove the second step with
        it instead of the account password: at a sign-in, at a step-up, and to reset
        a forgotten password. It is a change of the second factor, so the security
        hold starts. An account has at most ten passkeys.'
      parameters:
      - description: A name, and the answer of the device
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.AddPasskeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.PasskeyAdded'
              type: object
        "400":
          description: 'validation_failed, or passkey_invalid: the answer does not
            match the registration'
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: step_up_required
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: passkey_exists or passkey_limit_reached
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: passkey_unavailable
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Add a passkey
      tags:
      - user-security
  /api/v1/user/passkeys/{id}:
    delete:
      description: Removes a passkey of the user. The account password stays the second
        step. It needs a fresh proof of the second factor, and starts the security
        hold.
      parameters:
      - description: The ID of the passkey
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/user.TOTPChanged'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: step_up_required
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: passkey_not_found
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Remove a passkey
      tags:
      - user-security
  /api/v1/user/password:
    put:
      consumes:
      - application/json
      description: 'The account password is a second step of the sign-in, after the
        code, never a replacement for it. The first password needs only the session;
        a change needs current_password. A new password has at least security.password.min_length
        characters (10 by default) and at most 256 bytes, and at least five different
        characters. A change ends every other session of the user. A wrong current
        password answers 403 password_invalid and counts toward the lock of the password:
        429 password_locked with Retry-After.'
      parameters:
      - description: The new password, and the current one for a change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.SetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
