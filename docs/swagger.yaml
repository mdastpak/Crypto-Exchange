info:
  contact: {}
  description: 'The HTTP API of the Crypto Exchange server. docs/api.md describes
    the conventions: the envelope, the error codes, sign-in, and the WebSocket messages.
    The unversioned paths of earlier releases still answer, as deprecated aliases
    of the paths under /api/v1.'
  title: Crypto Exchange API
  version: "1"
paths:
  /:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Welcome
      tags:
      - system
  /api/v1/admin/audit:
    get:
      description: The events that the filters select, newest first. Every filter
        is optional, and the filters combine. Pages follow the pagination convention
        of docs/api.md.
      parameters:
      - description: The hk of the user or administrator
        format: uuid
        in: query
        name: actor_id
        type: string
      - description: An action, such as currency.update
        in: query
        name: action
        type: string
      - description: A target type, such as currency
        in: query
        name: target_type
        type: string
      - description: A target id, such as the hk of a currency
        in: query
        name: target_id
        type: string
      - description: The outcome
        enum:
        - success
        - failure
        - denied
        in: query
        name: outcome
        type: string
      - description: Events at or after this time, in RFC 3339
        format: date-time
        in: query
        name: since
        type: string
      - description: Events before this time, in RFC 3339
        format: date-time
        in: query
        name: until
        type: string
      - description: The number of events, 50 by default
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - description: The next_cursor of the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/audit.EntryPage'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Query the audit log
      tags:
      - admin audit
  /api/v1/admin/auth:
    post:
      consumes:
      - application/json
      description: Sends a one-time code to the administrator's email address. The
        answer is the same whether or not the address belongs to an administrator.
      parameters:
      - description: The administrator's email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.adminSignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.SignInSessionInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Request an admin sign-in code
      tags:
      - admin sign-in
  /api/v1/admin/auth/{uuid}:
    post:
      consumes:
      - application/json
      description: Checks the emailed code and the authenticator (TOTP) code, and
        returns an admin access token.
      parameters:
      - description: The sign-in session from the code request
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: The emailed code and the authenticator code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.adminVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.AccessTokenInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/models.APIResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Verify an admin sign-in
      tags:
      - admin sign-in
  /api/v1/admin/currencies:
    get:
      description: Every currency, whatever its status, deleted ones included, newest
        first by default, with its version. Read from the database, not the public
        cache. The filters are those of GET /public/currencies, plus status; they
        are optional and combine, and an unknown parameter is refused. Pages follow
        the pagination convention of docs/api.md.
      parameters:
      - collectionFormat: csv
        description: Statuses, repeated or comma-separated
        in: query
        items:
          enum:
          - approved
          - pending
          - suspend
          - deleted
          type: string
        name: status
        type: array
      - description: Text in the symbol, English name, or Persian name, normalized;
          symbols that match it come first
        in: query
        maxLength: 64
        name: q
        type: string
      - collectionFormat: csv
        description: Symbols, in any case, repeated or comma-separated
        in: query
        items:
          type: string
        name: symbol
        type: array
      - description: Text in the English name, in any case
        in: query
        maxLength: 64
        name: en_name
        type: string
      - description: Text in the Persian name, with Arabic letters and Persian or
          Arabic digits matching the Persian ones
        in: query
        maxLength: 64
        name: fa_name
        type: string
      - description: The contract address, in any case
        in: query
        maxLength: 128
        name: contract
        type: string
      - description: Only currencies with a contract, or only those without
        in: query
        name: has_contract
        type: boolean
      - description: Only tokens, or only currencies that are not
        in: query
        name: is_token
        type: boolean
      - description: Only fiat currencies, or only those that are not
        in: query
        name: if_fiat
        type: boolean
      - description: Created at or after this RFC 3339 time
        format: date-time
        in: query
        name: created_since
        type: string
      - description: Created before this RFC 3339 time
        format: date-time
        in: query
        name: created_until
        type: string
      - description: Updated at or after this RFC 3339 time
        format: date-time
        in: query
        name: updated_since
        type: string
      - description: The order, with - for descending; the hk breaks ties
        enum:
        - symbol
        - -symbol
        - en_name
        - -en_name
        - created_at
        - -created_at
        - updated_at
        - -updated_at
        in: query
        name: sort
        type: string
      - description: The number of currencies, 50 by default
        in: query
        maximum: 200
        minimum: 1
        name: limit
        type: integer
      - description: The next_cursor of the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/admin.CurrencyPage'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: List currencies
      tags:
      - admin currencies
    post:
      consumes:
      - application/json
      parameters:
      - description: The currency
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.currencyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.CurrencyCreatedInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Create a currency
      tags:
      - admin currencies
  /api/v1/admin/currencies/{hk}:
    delete:
      description: Soft-deletes the currency. With version, the delete is refused
        with 409 version_conflict when the currency has changed since.
      parameters:
      - description: The currency's UUID
        format: uuid
        in: path
        name: hk
        required: true
        type: string
      - description: The version the delete is based on
        in: query
        minimum: 1
        name: version
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.VersionInfo'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete a currency
      tags:
      - admin currencies
    get:
      description: Whatever its status, deleted ones included.
      parameters:
      - description: The currency's UUID
        format: uuid
        in: path
        name: hk
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                info:
                  $ref: '#/definitions/models.Currency'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.APIResponse'
        default:
          description: Any other error, in the envelope with a code
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Get a currency with its version
      tags:
      - admin currencies
    put:
      consumes:
      - application/json
