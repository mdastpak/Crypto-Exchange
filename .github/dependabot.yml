version: 2
# Each update waits until its release is two weeks old, so that a broken or
# compromised release is likely to be found and withdrawn before it is
# proposed here. Security updates do not wait.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Minor and patch updates come in one pull request; each major update
      # comes alone, since it may need code changes.
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "build(deps)"
