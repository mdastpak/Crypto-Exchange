name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The latest patch release of the Go version in go.mod, as the Dockerfile
  # uses. The "checks" job fails when the two disagree.
  GO_VERSION: "1.26"

jobs:
  checks:
    name: Build, vet, and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Check that GO_VERSION is the Go version of go.mod
        run: |
          go_mod=$(awk '/^go /{split($2, v, "."); print v[1] "." v[2]}' go.mod)
          echo "go.mod: $go_mod, GO_VERSION: $GO_VERSION"
          test "$go_mod" = "$GO_VERSION"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not formatted; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy -diff

      # The OpenAPI document in docs/ is generated from the annotations of
      # the handlers (#54), with the swag version of go.mod. A test checks
      # that it documents every route.
      - name: Check that the OpenAPI document is up to date
        run: |
          swag="github.com/swaggo/swag/cmd/swag@$(go list -m -f '{{.Version}}' github.com/swaggo/swag)"
          go run "$swag" init -g cmd/server/main.go -o docs --parseInternal
          if ! git diff --exit-code -- docs/docs.go docs/swagger.json docs/swagger.yaml; then
            echo "::error::The OpenAPI document is out of date; regenerate it with: go run $swag init -g cmd/server/main.go -o docs --parseInternal"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # The linters, the formatter, and every exclusion are in .golangci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s --health-timeout 10s --health-retries 30
      # The Transit engine for internal/keys; OpenBao and Vault share its API.
      openbao:
        image: openbao/openbao:2.4.1
        env:
          BAO_DEV_ROOT_TOKEN_ID: test
        ports: ["8200:8200"]
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # Each package has databases of its own, so packages run in parallel.
      # internal/app runs the server end to end and takes about eight
      # minutes with the race detector, near go test's default limit of ten
      # per package; the limit is twenty.
      - name: Test with the race detector
        run: |
          set -o pipefail
          go test -race -timeout 20m -count=1 -v -covermode=atomic -coverprofile=coverage.out ./... 2>&1 | tee test.log

      # Tests skip themselves when a service is unreachable, which would turn
      # a broken service container into a green check.
      - name: Check that no test was skipped for a missing service
        if: ${{ !cancelled() }}
        run: |
          if grep -E 'is not reachable|the go tool is not available' test.log; then
            echo "::error::Tests were skipped because a service or tool was missing"
            exit 1
          fi

      - name: Summarize coverage
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Test coverage"
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: |
            coverage.out
            test.log
          retention-days: 14

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # The files to skip are listed in .markdownlint-cli2.jsonc.
      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.13.0 "**/*.md"

  # A pull request stays reviewable (#311, CONTRIBUTING.md "Review policy"):
  # above 800 changed lines of non-generated code, the check warns. It never
  # fails: a change that cannot be split says why in its description.
  size:
    name: Pull request size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Count the changed lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LIMIT: "800"
        run: |
          # Generated files, the module checksums, test data, and the
          # CHANGELOG do not count.
          changed=$(git diff --numstat "$BASE"...HEAD -- . \
              ':(exclude)docs/docs.go' ':(exclude)docs/swagger.json' ':(exclude)docs/swagger.yaml' \
              ':(exclude)go.sum' ':(exclude)**/testdata/**' ':(exclude)CHANGELOG.md' \
            | awk '$1 != "-" { n += $1 + $2 } END { print n + 0 }')
          echo "Changed lines of non-generated code: $changed (guideline: $LIMIT)"
          echo "Changed lines of non-generated code: **$changed** (guideline: $LIMIT)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$changed" -gt "$LIMIT" ]; then
            echo "::warning::This pull request changes $changed lines of non-generated code, above the guideline of $LIMIT. Split it into reviewable steps, or say in its description why it cannot be split (CONTRIBUTING.md, Review policy)."
          fi
