version: "2"

run:
  timeout: 5m

linters:
  # The standard linters (errcheck, govet, ineffassign, staticcheck, unused)
  # and these.
  enable:
    - gosec
    - nolintlint
    - revive
  settings:
    nolintlint:
      # Every //nolint names its linter and says why, and one that no
      # longer suppresses anything is reported.
      require-explanation: true
      require-specific: true
    errcheck:
      exclude-functions:
        # A deferred Rollback runs after Commit too, when it returns
        # sql.ErrTxDone. A rollback that fails on a broken connection
        # cannot be retried, and the pool discards that connection.
        - (*database/sql.Tx).Rollback
    gosec:
      excludes:
        # Unhandled errors are errcheck's job, with the exclusions below.
        # G104 reports the same calls again, without them.
        - G104
    revive:
      max-open-files: 200
  exclusions:
    rules:
      # Closing a connection, channel, statement, result set, or listener
      # only releases it, so an error leaves nothing to do. A Close that
      # completes a write, such as that of the SMTP data writer, must be
      # checked, and is.
      - linters: [errcheck]
        text: "Error return value of `[^`]*\\.Close` is not checked"
      # The admin command prints to the operator's terminal; when that
      # fails, there is nothing left to tell anyone.
      - path: ^cmd/admin/
        linters: [errcheck]
        text: "Error return value of `fmt\\.Fprint"
      # Tests use fixed credentials for the local service containers,
      # throwaway keys and cookies, test servers, and subprocesses of the go
      # tool. None of it runs in production.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mdastpak/crypto-exchange
