# Asset registry: the assets the exchange supports, and their markets.
#
# Each asset is defined once by its symbol, with one entry per network it
# moves on, so USDT is one asset, held and traded as one balance, with a
# TRON and an Ethereum network. internal/assetregistry loads this file and
# refuses it when a symbol or an (asset, network) pair repeats, when a
# contract address does not pass its network's format and checksum, or when
# a market names an unknown asset. Nothing loads it at runtime yet (#57).
#
# Contract addresses come from the issuers and must be checked there before
# they are changed, since a wrong address sends funds to an arbitrary
# contract:
#   USDT: https://tether.to/en/supported-protocols/
#   USDC: https://developers.circle.com/stablecoins/usdc-contract-addresses
#   WBTC: https://etherscan.io/token/0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599
# Ethereum addresses are written in their EIP-55 checksummed form, which the
# loader verifies; TRON addresses carry a Base58Check checksum.
#
# Amounts are strings, so they keep their exact decimals. A max_withdrawal of
# "0" means no maximum.

assets:
  # Fiat currencies
  - symbol: "USD"
    name: "US Dollar"
    type: "FIAT"
    status: "ACTIVE"
    decimals: 2
    description: "United States Dollar"
    logo_url: "https://assets.example.com/fiat/usd.png"
    networks:
      - network: "internal"
        min_withdrawal: "10.00"
        max_withdrawal: "100000.00"
        withdrawal_fee: "2.50"
        deposit_enabled: true
        withdrawal_enabled: true
        custody_mode: "OFF_CHAIN"

