# AML rules (#73).
#
# The server syncs this file into the aml_rules table at startup when
# compliance.aml.enabled is on: a rule whose definition changed gets a new
# version, and a rule removed from the file is retired. See
# docs/aml.md for what each type, metric, and check means.
#
# Every key is checked: an unknown key, a field that the type does not use,
# or a missing threshold keeps the server from starting. Amounts are in
# USDT, valued at the current price of the price engine; an operation whose
# value needs a price that is not current goes to review.
#
# applies_to names the operations a rule evaluates: deposit, withdrawal,
# or trade. action is ALERT (an alert only), REVIEW (the operation waits for
# an administrator), BLOCK (refused), or FREEZE (refused, and the account is
# frozen). The strongest action of the rules that hit decides.

aml_rules:
  # Velocity: how often, and how much, over a window.
  - id: "velocity_high_frequency"
    name: "High Frequency Trading"
    description: "Unusually many trades from one account in an hour"
    rule_type: "VELOCITY"
    enabled: true
    applies_to: ["trade"]
    config:
      metric: "count"
    threshold_count: 100
    time_window_hours: 1
    action: "ALERT"
    severity: "MEDIUM"

  - id: "velocity_high_volume"
    name: "High Volume Trading"
    description: "Unusually high trading volume from one account in a day"
    rule_type: "VELOCITY"
    enabled: true
    applies_to: ["trade"]
    config:
      metric: "volume"
    threshold_amount: "1000000"
    time_window_hours: 24
    action: "REVIEW"
    severity: "HIGH"

  - id: "velocity_deposit_withdrawal"
    name: "Rapid Deposit-Withdrawal Cycles"
    description: "Withdrawals right after deposits (potential layering)"
    rule_type: "VELOCITY"
    enabled: true
    applies_to: ["withdrawal"]
    config:
      metric: "deposit_withdrawal_cycles"
    threshold_count: 5
    time_window_hours: 24
    action: "REVIEW"
    severity: "HIGH"

  - id: "large_transaction_report"
    name: "Large Transaction Reporting"
    description: "One operation at or above the reporting threshold"
    rule_type: "VELOCITY"
    enabled: true
    applies_to: ["deposit", "withdrawal", "trade"]
    config:
      metric: "single_amount"
    threshold_amount: "10000"
    time_window_hours: 1
    action: "ALERT"
    severity: "MEDIUM"

  # Structuring: several operations just below the reporting threshold.
  - id: "structuring_withdrawal"
    name: "Withdrawal Structuring"
    description: "Several withdrawals just below the reporting threshold"
    rule_type: "STRUCTURING"
    enabled: true
    applies_to: ["withdrawal"]
    config:
      ceiling: "10000"
    threshold_amount: "9000"
    threshold_count: 3
    time_window_hours: 24
    action: "BLOCK"
    severity: "CRITICAL"

  - id: "structuring_deposit"
    name: "Deposit Structuring"
    description: "Several deposits just below the reporting threshold"
    rule_type: "STRUCTURING"
    enabled: true
    applies_to: ["deposit"]
    config:
      ceiling: "10000"
    threshold_amount: "9000"
    threshold_count: 3
    time_window_hours: 24
    action: "REVIEW"
    severity: "HIGH"

  # High-risk countries. The country of the deployment must not be listed:
  # an Iranian deployment refuses a file that lists IR.
  - id: "high_risk_country_deposit"
    name: "Deposits from High-Risk Jurisdictions"
    description: "Deposits from, or requested from, high-risk countries"
    rule_type: "HIGH_RISK_COUNTRY"
    enabled: true
    applies_to: ["deposit"]
    config:
      countries: ["KP", "SY", "CU", "VE", "BY", "MM", "AF"]
      check_fields: ["counterparty_country", "ip_country"]
    time_window_hours: 1
    action: "BLOCK"
    severity: "CRITICAL"

  - id: "high_risk_country_withdrawal"
    name: "Withdrawals to High-Risk Jurisdictions"
    description: "Withdrawals to, or requested from, high-risk countries"
    rule_type: "HIGH_RISK_COUNTRY"
    enabled: true
    applies_to: ["withdrawal"]
    config:
      countries: ["KP", "SY", "CU", "VE", "BY", "MM", "AF"]
      check_fields: ["counterparty_country", "ip_country"]
    time_window_hours: 1
    action: "BLOCK"
    severity: "CRITICAL"

  - id: "cross_border_high_value"
    name: "High Value Cross-Border Flows"
    description: "High value moved to or from another country in a day"
    rule_type: "HIGH_RISK_COUNTRY"
    enabled: true
    applies_to: ["deposit", "withdrawal"]
    config:
      cross_border: true
      home_country: "IR"
      check_fields: ["counterparty_country"]
    threshold_amount: "50000"
    time_window_hours: 24
    action: "REVIEW"
    severity: "HIGH"

  # Unusual patterns.
  - id: "unusual_withdrawal_pattern"
    name: "Unusual Withdrawal Pattern"
    description: "A withdrawal unlike the account's own: new destination, large amount, odd time, or a burst"
    rule_type: "UNUSUAL_PATTERN"
    enabled: true
    applies_to: ["withdrawal"]
    config:
      pattern: "withdrawal_profile"
      checks: ["new_destination", "amount_deviation", "time_deviation", "velocity_spike"]
      history_days: 30
      new_destination_days: 30
      amount_deviation_multiplier: "5"
      time_deviation_hours: 6
      velocity_spike_multiplier: "5"
    threshold_count: 2
    time_window_hours: 24
    action: "REVIEW"
    severity: "HIGH"

  - id: "dormant_account_activation"
    name: "Dormant Account Sudden Activity"
    description: "Activity from an account that had none for 90 days"
    rule_type: "UNUSUAL_PATTERN"
    enabled: true
    applies_to: ["deposit", "withdrawal", "trade"]
    config:
      pattern: "dormant_account"
      dormant_days: 90
    time_window_hours: 24
    action: "REVIEW"
    severity: "HIGH"

  # Screening rules ask a provider; without one configured they are not
  # evaluated, and the server says so at startup.
  - id: "mixer_deposit"
    name: "Mixer/Tumbler Deposit Detection"
    description: "Deposits from known mixer or tumbler addresses"
    rule_type: "MIXER"
    enabled: true
    applies_to: ["deposit"]
    config:
      list: "chainalysis_mixer"
    time_window_hours: 1
    action: "REVIEW"
    severity: "HIGH"

  - id: "mixer_withdrawal"
    name: "Mixer/Tumbler Withdrawal Detection"
    description: "Withdrawals to known mixer or tumbler addresses"
    rule_type: "MIXER"
    enabled: true
    applies_to: ["withdrawal"]
    config:
      list: "chainalysis_mixer"
    time_window_hours: 1
    action: "BLOCK"
    severity: "CRITICAL"

  - id: "darknet_deposit"
    name: "Darknet Market Deposit Detection"
    description: "Deposits from known darknet market addresses"
    rule_type: "DARKNET"
    enabled: true
    applies_to: ["deposit"]
    config:
      list: "chainalysis_darknet"
    time_window_hours: 1
    action: "BLOCK"
    severity: "CRITICAL"

  - id: "darknet_withdrawal"
    name: "Darknet Market Withdrawal Detection"
    description: "Withdrawals to known darknet market addresses"
    rule_type: "DARKNET"
    enabled: true
    applies_to: ["withdrawal"]
    config:
      list: "chainalysis_darknet"
    time_window_hours: 1
    action: "BLOCK"
    severity: "CRITICAL"

  - id: "sanctions_user"
    name: "Sanctioned User"
    description: "The account holder is on a sanctions list"
    rule_type: "SANCTIONS"
    enabled: true
    applies_to: ["deposit", "withdrawal", "trade"]
    config:
      providers: ["ofac", "chainalysis", "trm"]
      screen: "user"
    time_window_hours: 1
    action: "FREEZE"
    severity: "CRITICAL"

  - id: "sanctions_deposit_address"
    name: "Sanctioned Deposit Address"
    description: "Deposits from sanctioned addresses"
    rule_type: "SANCTIONS"
    enabled: true
    applies_to: ["deposit"]
    config:
      providers: ["ofac", "chainalysis"]
      screen: "counterparty"
    time_window_hours: 1
    action: "BLOCK"
    severity: "CRITICAL"

  - id: "sanctions_withdrawal_address"
    name: "Sanctioned Withdrawal Address"
    description: "Withdrawals to sanctioned addresses"
    rule_type: "SANCTIONS"
    enabled: true
    applies_to: ["withdrawal"]
    config:
      providers: ["ofac", "chainalysis", "trm"]
      screen: "counterparty"
    time_window_hours: 1
    action: "BLOCK"
    severity: "CRITICAL"

  - id: "pep_user"
    name: "Politically Exposed Person"
    description: "The account holder is a politically exposed person"
    rule_type: "PEP"
    enabled: true
    applies_to: ["withdrawal"]
    config:
      providers: ["chainalysis"]
    time_window_hours: 1
    action: "REVIEW"
    severity: "HIGH"

engine:
  # The batch evaluation of the velocity and structuring rules, and the
  # escalation of old alerts.
  evaluation_interval_seconds: 60
  alert_escalation_hours: 24
  # The alerts that hold or refuse an operation, and escalations.
  notifications:
    email:
      enabled: false
      recipients:
        - "compliance@example.com"
