# Crypto Exchange Configuration Example
#
# Copy this file to config/config.local.yaml (ignored by Git) and adjust it,
# then start the server with -config config/config.local.yaml. Without a
# configuration file, the server uses an embedded copy of this file.
#
# Keep secrets out of this file: set them with the environment variables named
# in the comments. Every environment variable is listed in
# docs/configuration.md, and an empty variable leaves the setting unchanged.
# ${VAR} placeholders are not expanded in this file.
#
# With mode "release", the server refuses insecure settings, such as no TLS,
# sslmode "disable", or default credentials, and lists every problem at once;
# see "Release mode" in docs/configuration.md.

deployment:
  # The region of this release: "ir" (Iran, the default) or "international".
  # An international release refuses the features of Iran, such as Shahkar,
  # Kavenegar, the Iranian exchanges, and toman prices; see "Region of a
  # release" in docs/configuration.md. DEPLOYMENT_REGION overrides it.
  region: ir

server:
  ip: "0.0.0.0"                # Listen address; empty listens on every interface
  port: "8080"
  read_timeout_seconds: 10     # HTTP read, write, and keep-alive idle timeouts
  write_timeout_seconds: 10
  idle_timeout_seconds: 120
  shutdown_timeout_seconds: 30 # The whole shutdown, after SIGINT or SIGTERM
  drain_seconds: 0             # Keep serving this long after readiness turns 503
  mode: "debug"  # This file is for development. Unset, the mode is release (#306). Set with SERVER_MODE.
  # IPs or CIDR ranges of reverse proxies (load balancer, ingress) whose
  # X-Forwarded-For and X-Real-IP headers are trusted. Leave empty when clients
  # connect directly; otherwise they could spoof their address.
  trusted_proxies: []
  # A second address (host:port) on a private network for the admin routes,
  # which the main address then answers with 404. Empty: they are served on
  # the main address. See "Where the admin routes are served" in
  # docs/configuration.md.
  admin_listen_addr: ""
  tls:
    # Serve HTTPS with this certificate and key, which are checked at startup.
    enabled: false
    cert_file: "config/ssl/cert.pem"
    key_file: "config/ssl/key.pem"
    # Or: a reverse proxy terminates TLS in front of the server. Release mode
    # needs one of the two, and trusted_proxies with this one.
    behind_proxy: false
  hsts:
    # Strict-Transport-Security. Unset "enabled" sends it when tls.enabled or
    # tls.behind_proxy is true.
    max_age_seconds: 31536000
    include_subdomains: false
  cors:
    # Exact browser origins (scheme://host[:port]) allowed to call the API with
    # credentials, for example "https://app.example.com". Empty: no
    # cross-origin access. A wildcard ("*") is rejected at startup.
    allowed_origins: []

postgres:
  host: "localhost"
  port: "5432"
  user: "postgres"
  password: ""  # Set with POSTGRES_PASSWORD
  dbname: "exchange"
  # Release mode needs require, verify-ca, or verify-full.
  sslmode: "disable"
  max_open_conns: 25            # Connection pool limits
  max_idle_conns: 5             # At most max_open_conns
  conn_max_lifetime_minutes: 5
  conn_max_idle_time_minutes: 5
  # High availability (#230): list every node instead of host and port;
  # connections take the first node that writes.
  # hosts: ["pg-1.internal:5432", "pg-2.internal:5432"]
  target_session_attrs: "read-write"
  statement_timeout_ms: 30000            # -1 turns a timeout off
  lock_timeout_ms: 5000                  # A request past it gets 503 database_busy
  idle_in_transaction_timeout_ms: 60000
  migration_lock_timeout_seconds: 300    # Startup stops, naming the holder, after this
  # Database roles (#180): the server runs as user, which cannot change the
  # schema; the migrations run as migrations.user. "startup" migrates when an
  # instance starts; "external", which release mode needs, leaves it to
  # "admin migrate" as a step of the release.
  migrations:
    mode: "startup"
    user: ""      # Empty: migrate as user, which then owns the schema
    password: ""  # Set with POSTGRES_MIGRATIONS_PASSWORD, only for admin migrate

redis:
  # standalone (host and port), sentinel, or cluster; see
  # docs/redis-high-availability.md
  mode: "standalone"
  host: "localhost"
  port: "6379"
  # sentinel:
  #   master_name: "crypto-exchange"
  #   addresses: ["sentinel-1:26379", "sentinel-2:26379", "sentinel-3:26379"]
  # cluster:
  #   addresses: ["redis-1:6379", "redis-2:6379", "redis-3:6379"]
  durable_writes:
    replicas: 0        # 1 with a primary and two replicas: a failover keeps the OTP attempts
    timeout_ms: 250
  username: ""  # Redis ACL user; set with REDIS_USERNAME. Empty is the default user.
  password: ""  # Set with REDIS_PASSWORD
  db: 0
  pool_size: 10                 # Connection pool size
  min_idle_conns: 2             # At most pool_size
  dial_timeout_ms: 1000         # Short timeouts, so that requests fail fast while Redis is down
  read_timeout_ms: 1000
  write_timeout_ms: 1000
  pool_timeout_ms: 2000
  max_retries: 1  # -1 turns retries off
  currency_cache_ttl_seconds: 300  # Changes invalidate the list at once; this bounds a missed invalidation
  # Redis must run with maxmemory-policy noeviction (#305): any other policy
  # may drop logged-out tokens and attempt counters. Release mode reads the
  # policy at start and refuses any other; set this only where Redis refuses
  # CONFIG GET and you have checked the policy yourself.
  assume_noeviction: false      # REDIS_ASSUME_NOEVICTION
  tls:                          # Release mode needs TLS, or private_network: true
    enabled: false              # REDIS_TLS_ENABLED
    ca_file: ""                 # PEM file of a private CA; empty uses the system CAs
    server_name: ""             # Name in the certificate, when it differs from host
    cert_file: ""               # Client certificate for mutual TLS, with key_file
    key_file: ""
    private_network: false      # Only a trusted private network carries the connection

rabbitmq:
  username: ""  # Set with RABBITMQ_USER
  password: ""  # Set with RABBITMQ_PASSWORD
  host: "localhost"
  port: "5672"
  # hosts: ["rmq-1.internal:5671", "rmq-2.internal:5671", "rmq-3.internal:5671"]  # A cluster, in place of host and port
  vhost: "/"                    # Set with RABBITMQ_VHOST
  tls:                          # Release mode needs enabled, or private_network (see redis.tls)
    enabled: false
    ca_file: ""
  exchanges:                    # Fan-out exchanges, declared at startup
    price_updates: "price_updates"  # Currency events for WebSocket clients
    trade_events: "trade_events"
    order_events: "order_events"
    settlement: "settlement"
    notifications: "notifications"

jwt:
  ssl:
    # Each role signs its tokens with its own RSA key pair (at least 2048
    # bits), so a user token is never accepted on admin routes. Admin keys
    # are optional; without them, admin routes reject every token. Both roles
    # must use different keys.
    admin:
      # For example "internal/ssl/admin/private_key.pem". Set with
      # JWT_SSL_ADMIN_PRIVATE_KEY and JWT_SSL_ADMIN_PUBLIC_KEY.
      private_key: ""
      public_key: ""
      retired_public_keys: []  # Earlier admin public keys, accepted until their tokens expire
      next_public_keys: []     # The next admin public key, accepted before it signs (rotation phase 1)
    user:
      # Generated as described in the README. Paths are relative to the
      # working directory. Set with JWT_SSL_USER_PRIVATE_KEY and
      # JWT_SSL_USER_PUBLIC_KEY.
      private_key: "internal/ssl/user/private_key.pem"
      public_key: "internal/ssl/user/public_key.pem"
      # Earlier user public keys, for key rotation, for example:
      # - "internal/ssl/user/2026-10/public_key.pem"
      retired_public_keys: []
      # The public key that will sign next, accepted by every instance
      # before any signs with it (phase 1 of a rotation, see
      # docs/configuration.md).
      next_public_keys: []
  issuer: "crypto-exchange"     # The iss claim, required on every token
  access_token:
    expiration_minutes: 15     # At most 1440 (a day)
  refresh_token:
    expiration_minutes: 10080  # 7 days; at least the access token lifetime
    reuse_grace_seconds: 10    # The replaced token still works this long, for concurrent tabs
  sessions:
    max_per_user: 5            # Active sessions per user; a sign-in past it must end one
    max_lifetime_minutes: 43200  # 30 days; no refresh extends a session past this

otp:
  auth:
    name: "AUTH"                 # Parsed, but not used yet
    ttl_seconds: 60              # Lifetime of a code and its sign-in session
    length: 6                    # 4 to 10 digits
    retry_limit: 3               # Verification attempts per code
    contact_requests_per_hour: 5   # Codes issued to one email address or mobile number, per client
    contact_attempts_per_hour: 10  # Verification attempts for one contact across all of its codes, per client
    contact_requests_total_per_hour: 20  # Codes for one contact from all clients; known clients are exempt
    # Development only: write sign-in codes to the log instead of delivering
    # them. The server refuses to start with this enabled in release mode
    # (GIN_MODE=release).
    dev_log_codes: false

# Delivery of sign-in codes. Codes are queued on the notifications exchange
# and a worker delivers them over the channel that matches the contact: email
# addresses by SMTP and mobile numbers by SMS. A contact type without a
# configured channel cannot sign in.
notifications:
  email:
    host: ""                # Empty disables email
    port: 587
    username: ""
    password: ""            # Or set SMTP_PASSWORD
    from: "Exchange <no-reply@example.com>"
    implicit_tls: false     # true for implicit TLS, usually on port 465
    timeout_seconds: 10
    # Go text/template templates with {{.Code}} and {{.TTLSeconds}}. Write
    # them in the language of your users.
    otp_subject: "Your sign-in code"
    otp_body: |
      Your sign-in code is {{.Code}}. It expires in {{.TTLSeconds}} seconds.

      If you did not request this code, you can ignore this email. Never share it with anyone.
    # The codes that confirm a withdrawal (#161), never sent with the
    # sign-in text. They can also use {{.Details}}, such as
    # "100 USDT to TR7NHq...gjLj6t".
    withdrawal_subject: "Confirm your withdrawal"
    withdrawal_body: |
      Your code to confirm the withdrawal of {{.Details}} is {{.Code}}. It expires in {{.TTLSeconds}} seconds.

      If you did not request this withdrawal, do not enter or share the code: sign in, change your password, and contact support.
    # The HTML part beside the text: en or fa (config/email), none for text
    # only, or a directory with otp.html and withdrawal.html.
    html_templates: en
  sms:
    provider: ""            # "kavenegar", or empty to disable SMS
    kavenegar:
      api_key: ""           # Or set KAVENEGAR_API_KEY
      otp_template: ""      # A verify template approved in the Kavenegar panel; the code fills %token
      withdrawal_template: ""  # For withdrawal codes: %token the code, %token10 what it confirms; empty is no SMS for them
      base_url: "https://api.kavenegar.com"
      timeout_seconds: 10
  worker:
    concurrency: 4          # Codes delivered in parallel
    max_attempts: 3         # Attempts per code; delivery also stops when the code expires

admin:
  # Least duration of an answer to an admin sign-in request, so that it does
  # not tell administrators' addresses from unknown ones.
  sign_in_min_response_ms: 400
  # Minutes that a sign-in or a fresh authenticator code opens the sensitive
  # admin routes (platform controls, restrictions, delistings, re-seals).
  step_up_minutes: 5
  # CIDR ranges or addresses whose clients may call the admin routes, such as
  # the range of a VPN. Empty: every address.
  allowed_cidrs: []
  sessions:
    # Sessions of one administrator at once; a sign-in past it ends the oldest.
    max_per_admin: 2

# Email and mobile changes of users.
contacts:
  new_contact_cooldown_hours: 72  # A new contact cannot replace or remove another one for this long

# What follows a change of the email, the mobile, or the second factor.
security:
  change_hold_hours: 24  # Withdrawals and other second-factor operations are held this long
  # The account password of users, the second step of their sign-in.
  password:
    min_length: 10       # Characters; at least 8
    max_failures: 5      # Wrong passwords in a row that lock the password
    lock_minutes: 15     # How long a locked password is not checked
  second_factor:
    # required_for_funds: a password must be set before deposits and
    # withdrawals. optional: users without one are not asked.
    mode: required_for_funds
    step_up_minutes: 5   # How long a proof of the factor opens the operations it protects
  # Passkeys of users (WebAuthn): Face ID, a fingerprint, Windows Hello, or
  # a security key as the second step. Off while rp_id is empty.
  passkeys:
    rp_id: ""            # The domain the passkeys are bound to, such as example.com
    rp_name: ""          # Shown in the passkey prompt; empty takes exchange.name
    origins: []          # Such as https://app.example.com; each under rp_id
  # Recovery of an account whose password and recovery codes are lost.
  recovery:
    # standard: every verified contact is proved, then the wait. strict:
    # an account with a verified national ID also proves its identity again.
    mode: standard
    wait_hours: 72       # How long a proved recovery waits; the password cancels it
    # The identity steps of the strict mode. Empty means both.
    # steps: [national_id, mobile_ownership]

# Identity checks with a KYC provider.
identity:
  mobile_ownership:
    provider: none            # none, stub (development only), or jibit
    # endpoint: https://napi.jibit.ir/ide
    # api_key and secret_key: set IDENTITY_MOBILE_OWNERSHIP_API_KEY and _SECRET_KEY
    timeout_seconds: 10
    recheck_days: 30          # A sign-in checks a number again after this long
  bank_ownership:
    provider: none            # none or stub (development only), until Jibit or Finnotech is added
    timeout_seconds: 10

# Personal favorites of currencies and trading pairs.
favorites:
  max_per_user: 100            # Favorite currencies and pairs per user, together

# Delistings and migrations of currencies: every instance applies the steps
# that are due.
delisting:
  interval_seconds: 30         # How often; a step applies at most this late

# cmd/market-worker: collects the global market data catalog (unverified
# assets, and the markets of global and Iranian exchanges); see
# docs/market-data.md. The server does not read this section.
market_data:
  enabled: false               # Run the jobs; off answers only the probes
  mode: dry_run                # dry_run (collect and check, write nothing) or live
  health_addr: ":8081"         # /system/live and /system/ready
  poll_seconds: 5              # How often each worker looks for due jobs
  lease_seconds: 60            # How soon another worker takes over a dead worker's job
  max_concurrent_jobs: 4       # Runs of one worker at once
  retry_base_seconds: 30       # Wait after a failed run, doubled per failure up to the job's interval
  # How this node reaches the sources: direct, proxy (proxy_url), or none.
  egress:
    default: direct
    proxy_url: ""              # Prefer MARKET_DATA_PROXY_URL (http, https, or socks5)
  # Sources by name. Limits are those of the plan, counted across all nodes.
  sources:
    coingecko:
      enabled: false
      requests_per_minute: 25  # Free (demo) plan: 30 per minute, 10,000 per month
      monthly_requests: 9000
    coinmarketcap:
      enabled: false           # Needs MARKET_DATA_COINMARKETCAP_API_KEY, on every plan
      requests_per_minute: 25  # Free (Basic) plan: 30 per minute, 10,000 credits per month
      monthly_requests: 9000
    # Venues (docs/market-data.md#tickers): public endpoints, no key.
    binance: {enabled: false}
    okx: {enabled: false}
    kraken: {enabled: false}
    coinbase: {enabled: false}
    nobitex: {enabled: false}  # Iranian venues often answer only from Iran: egress: direct on a node there
    wallex: {enabled: false}
  # The catalog of assets (docs/market-data.md#catalog).
  catalog:
    priority: [coingecko, coinmarketcap]  # Primary source first
    coverage: list             # list (16 assets, development), top, or all (production)
    top: 500                   # Assets of the top coverage
    interval_hours: 24
    details_per_run: 200       # Full records read per run
    details_max_age_days: 30   # When a record is read again
    deactivate_after_days: 14  # Unlisted this long: inactive (all coverage only)
  # The tickers of the venues (docs/market-data.md#tickers).
  tickers:
    interval_seconds: 120      # Time between two runs of a venue
    stale_after_seconds: 600   # Older tickers are stale
    outlier_percent: 5         # Further from the median of the venues: an outlier
    min_venues: 3              # Venues with a fresh price that make a median
    map_rank_limit: 1000       # A shared symbol maps to the only asset ranked within this
    deactivate_pairs_after_hours: 24
  # The candles of the venues (docs/market-data.md#candles).
  candles:
    quotes: [USDT, USD, IRT]   # Pairs with these quotes
    max_pairs_per_venue: 200   # The best-ranked bases first
    requests_per_run: 300      # Per venue and resolution
    # Each resolution keeps the pairs of some collection tiers only.
    resolutions:
      1d: {enabled: true, interval_minutes: 360, backfill_days: 3650, retention_days: 0, tiers: [hot, active, other]}
      1h: {enabled: true, interval_minutes: 60, backfill_days: 180, retention_days: 180, tiers: [hot, active, other]}
      15m: {enabled: true, interval_minutes: 15, backfill_days: 90, retention_days: 90, tiers: [hot, active]}
      5m: {enabled: true, interval_minutes: 5, backfill_days: 30, retention_days: 30, tiers: [hot, active]}
      1m: {enabled: true, interval_minutes: 1, backfill_days: 1, retention_days: 7, tiers: [hot]}
  # The collection tiers of the pairs (docs/market-data.md#collection-tiers).
  tiers:
    interval_hours: 24
    hot_assets: [bitcoin, ethereum, tether]  # Catalog slugs whose pairs are hot
    hot_listed: true           # Pairs of currencies listed on this exchange are hot
    active_top: 200            # Next pairs by 24-hour volume in USD, over every venue
    hysteresis_percent: 20     # An active pair leaves only past rank active_top + 20 %
  # Live tickers of the hot pairs from the venues' WebSocket streams
  # (docs/market-data.md#live-tickers).
  streams:
    enabled: true
    tiers: [hot]
    max_pairs: 200             # Pairs of one venue's stream
    max_per_worker: 2          # Streams one worker holds, apart from max_concurrent_jobs
    run_minutes: 60            # A worker holds a stream this long, then the workers share it again
    flush_millis: 1000         # A pair is written at most once in this time
    quiet_seconds: 60          # A quiet stream reconnects after this
  # The public routes of the server (docs/market-data.md#public-api). The
  # server reads this and the quality rules of tickers above.
  api:
    regions: []                # Venue regions shown; [global] for an international release
    cache_seconds: 30          # Redis and client cache of an answer

# Data-protection keys, wrapped by a key-encryption key (KEK) in a key
# management service; see docs/data-protection.md. They protect the sign-in
# codes in Redis, the authenticator secrets of administrators, and the row
# seals.
keys:
  # "transit" (HashiCorp Vault or OpenBao), "local" (development only, refused
  # in release mode), or empty to load no keys, which release mode refuses:
  # sign-in codes then use a random secret of the process, and admin sign-in
  # is disabled.
  provider: ""
  local:
    kek: ""                 # Prefer KEYS_LOCAL_KEK (openssl rand -base64 32)
  transit:
    address: ""             # VAULT_ADDR, such as https://vault.internal:8200
    token: ""               # Prefer VAULT_TOKEN, or token_file
    token_file: ""          # Read on every request, so an agent can renew it
    mount: "transit"
    key: ""                 # The Transit key that wraps the data keys
    ca_cert: ""             # VAULT_CACERT: PEM file of the CAs to trust
    timeout_seconds: 10
  reload_interval_seconds: 60    # How often each instance loads a change of data_keys
  activation_delay_seconds: 300  # A rotated key writes only after this; at least 2x the reload interval
  # Row seals (#139): a keyed MAC over the protected rows, with the row-mac key.
  row_seals:
    # report records a row that does not match its seal; enforce also refuses
    # it. Empty: enforce in release mode with keys.provider, report otherwise.
    mode: ""
    verify_interval_minutes: 60   # How often the background verifier walks the protected tables

websocket:
  # Origins accepted by the WebSocket origin check; empty allows same-origin
  # connections only. Release mode refuses "*" and origins without https.
  allowed_origins: []
  ping_interval_seconds: 30        # A client that misses two pings is disconnected
  max_message_size_bytes: 4096     # Largest client message, at most 1 MiB
  write_timeout_seconds: 10
  client_messages_per_second: 10   # Messages per connection; a faster client is disconnected
  client_message_burst: 20
  max_connections: 10000           # Per server instance
  max_connections_per_ip: 20       # Per client address, over all instances
  max_connections_per_user: 10     # Per signed-in user, over all instances
  session_check_seconds: 60        # How often ended sessions are disconnected

# The country of each client (#284), for the site of their country.
# See docs/geoip.md.
geoip:
  enabled: false
  header: ""                       # e.g. CF-IPCountry; trusted only from server.trusted_proxies
  database_path: ""                # e.g. /var/lib/geoip/GeoLite2-Country.mmdb
  reload_interval_seconds: 300     # A new file is loaded without a restart
  max_age_days: 45                 # Older databases make /system/ready degraded
  overrides: {}                    # Local tests only, e.g. {"192.168.0.0/16": "IR"}

# The languages of the product (#283). Direction (RTL/LTR) and names come
# from each language; see docs/i18n.md.
i18n:
  locales: [en, fa]                # BCP 47 tags; en is required
  default_locale: en               # For a request that names no supported locale

# The sites per country (#285): the domain, countries, and locales of each.
# Empty: one site, no redirects. See docs/i18n.md.
sites:
  default: ""                      # The id of the site of every other country
  scheme: https                    # http only for development
  list: []
  # list:
  #   - {id: global, domain: example.com, aliases: [www.example.com], locales: [en]}
  #   - {id: ir, domain: example.ir, countries: [IR], locales: [fa, en]}

# Maintenance and lockdown controls (#235). The controls are created with the
# admin API or cmd/admin; these settings say how each instance applies them.
platform:
  poll_interval_ms: 1000           # A change applies on every instance within this
  stale_after_seconds: 30          # Then fail_closed closes while the controls are unknown
  fail_closed: [deposits, withdrawals, trading]   # ["none"] closes nothing
  lift_approval: [withdrawals, trading]           # Needs a second administrator to lift

# What each verification level of a user may do (#157). Level 0 has a
# verified contact only; level 1 has the national ID matched with the owner
# of a bank card or account; level 2 adds a reviewed video identity check
# and a commitment letter. An action left out takes its default.
verification:
  min_level:
    deposit_fiat: 1
    deposit_crypto: 1
    trade_otc: 1
    trade_market: 1
    withdraw_fiat: 1
    withdraw_crypto: 2
  # Per currency symbol and level, in units of the currency, the fee
  # included. Empty or absent is no limit. Unset takes these defaults.
  withdrawal_limits:
    IRR:
      1: {daily: "1000000000"}       # 100 million tomans in any 24 hours
      # Level 2 has no limit of the exchange: payouts follow the transfer
      # limits of the banks and providers, split if needed (#70, #74).

# The withdrawal destinations of users (#160): their own cards, IBANs, and
# accounts, and crypto addresses.
withdrawals:
  max_destinations: 20
  fiat_destination_wait_hours: 0     # The user's own accounts wait for nothing
  crypto_destination_wait_hours: 24  # A new address is usable after this long

# The sections from here to compliance are parsed but not used yet, except
# exchange.name, which authenticator apps show as the issuer. They describe
# the configuration of roadmap features; see "Settings reserved for roadmap
# features" in docs/configuration.md.
exchange:
  name: "Crypto Exchange"
  timezone: "UTC"

assets:
  registry_path: "config/assets.yaml"
  auto_sync: true

markets:
  default_maker_fee_bps: 10
  default_taker_fee_bps: 20
  enable_market_orders: true
  enable_stop_orders: true

price_aggregator:
  enabled: true
  providers:
    - name: "binance"
      enabled: true
      type: "websocket"
      ws_endpoint: "wss://stream.binance.com:9443/ws"
      rest_endpoint: "https://api.binance.com"
      api_key: ""  # Set with BINANCE_API_KEY
      api_secret: ""  # Set with BINANCE_API_SECRET
      passphrase: ""
      symbols:
        - "btcusdt"
        - "ethusdt"
        - "trxusdt"
        - "usdtusd"
      rate_limit: 10
      timeout_seconds: 10
      reconnect_delay_seconds: 5
    - name: "coinbase"
      enabled: false
      type: "websocket"
      ws_endpoint: "wss://ws-feed.exchange.coinbase.com"
      rest_endpoint: "https://api.exchange.coinbase.com"
      api_key: ""
      api_secret: ""
      passphrase: ""
      symbols:
        - "BTC-USD"
        - "ETH-USD"
      rate_limit: 10
      timeout_seconds: 10
      reconnect_delay_seconds: 5
    - name: "kraken"
      enabled: false
      type: "websocket"
      ws_endpoint: "wss://ws.kraken.com"
      rest_endpoint: "https://api.kraken.com"
      symbols:
        - "XBT/USD"
        - "ETH/USD"
      rate_limit: 5
      timeout_seconds: 10
      reconnect_delay_seconds: 10
    - name: "bybit"
      enabled: false
