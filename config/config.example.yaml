# Crypto Exchange Configuration Example
#
# Copy this file to config/config.local.yaml (ignored by Git) and adjust it,
# then start the server with -config config/config.local.yaml. Without a
# configuration file, the server uses an embedded copy of this file.
#
# Keep secrets out of this file: set them with the environment variables named
# in the comments. Every environment variable is listed in
# docs/configuration.md, and an empty variable leaves the setting unchanged.
# ${VAR} placeholders are not expanded in this file.
#
# With mode "release", the server refuses insecure settings, such as no TLS,
# sslmode "disable", or default credentials, and lists every problem at once;
# see "Release mode" in docs/configuration.md.

server:
  ip: "0.0.0.0"                # Listen address; empty listens on every interface
  port: "8080"
  read_timeout_seconds: 10     # HTTP read, write, and keep-alive idle timeouts
  write_timeout_seconds: 10
  idle_timeout_seconds: 120
  mode: "debug"  # debug, release, or test. Set with SERVER_MODE.
  # IPs or CIDR ranges of reverse proxies (load balancer, ingress) whose
  # X-Forwarded-For and X-Real-IP headers are trusted. Leave empty when clients
  # connect directly; otherwise they could spoof their address.
  trusted_proxies: []
  tls:
    # Serve HTTPS with this certificate and key, which are checked at startup.
    enabled: false
    cert_file: "config/ssl/cert.pem"
    key_file: "config/ssl/key.pem"
    # Or: a reverse proxy terminates TLS in front of the server. Release mode
    # needs one of the two, and trusted_proxies with this one.
    behind_proxy: false
  cors:
    # Exact browser origins (scheme://host[:port]) allowed to call the API with
    # credentials, for example "https://app.example.com". Empty: no
    # cross-origin access. A wildcard ("*") is rejected at startup.
    allowed_origins: []

postgres:
  host: "localhost"
  port: "5432"
  user: "postgres"
  password: ""  # Set with POSTGRES_PASSWORD
  dbname: "exchange"
  # Release mode needs require, verify-ca, or verify-full.
  sslmode: "disable"
  max_open_conns: 25            # Connection pool limits
  max_idle_conns: 5             # At most max_open_conns
  conn_max_lifetime_minutes: 5
  conn_max_idle_time_minutes: 5

redis:
  host: "localhost"
  port: "6379"
  password: ""  # Set with REDIS_PASSWORD
  db: 0
  pool_size: 10                 # Connection pool size
  min_idle_conns: 2             # At most pool_size
  dial_timeout_ms: 1000         # Short timeouts, so that requests fail fast while Redis is down
  read_timeout_ms: 1000
  write_timeout_ms: 1000
  pool_timeout_ms: 2000
  max_retries: 1  # -1 turns retries off

rabbitmq:
  username: ""  # Set with RABBITMQ_USER
  password: ""  # Set with RABBITMQ_PASSWORD
  host: "localhost"
  port: "5672"
  exchanges:                    # Fan-out exchanges, declared at startup
    price_updates: "price_updates"  # Currency events for WebSocket clients
    trade_events: "trade_events"
    order_events: "order_events"
    settlement: "settlement"
    notifications: "notifications"

jwt:
  ssl:
    # Each role signs its tokens with its own RSA key pair (at least 2048
    # bits), so a user token is never accepted on admin routes. Admin keys
    # are optional; without them, admin routes reject every token. Both roles
    # must use different keys.
    admin:
      # For example "internal/ssl/admin/private_key.pem". Set with
      # JWT_SSL_ADMIN_PRIVATE_KEY and JWT_SSL_ADMIN_PUBLIC_KEY.
      private_key: ""
      public_key: ""
      retired_public_keys: []  # Earlier admin public keys, accepted until their tokens expire
    user:
      # Generated as described in the README. Paths are relative to the
      # working directory. Set with JWT_SSL_USER_PRIVATE_KEY and
      # JWT_SSL_USER_PUBLIC_KEY.
      private_key: "internal/ssl/user/private_key.pem"
      public_key: "internal/ssl/user/public_key.pem"
      # Earlier user public keys, for key rotation, for example:
      # - "internal/ssl/user/2026-10/public_key.pem"
      retired_public_keys: []
  issuer: "crypto-exchange"     # The iss claim, required on every token
  access_token:
    expiration_minutes: 15     # At most 1440 (a day)
  refresh_token:
    expiration_minutes: 10080  # 7 days; at least the access token lifetime

otp:
  auth:
    name: "AUTH"                 # Parsed, but not used yet
    ttl_seconds: 60              # Lifetime of a code and its sign-in session
    length: 6                    # 4 to 10 digits
    retry_limit: 3               # Verification attempts per code
    # Keys the hashes of sign-in codes and the encryption of contacts in
    # Redis. At least 32 bytes, shared by every server instance, and required
    # in release mode. Prefer the OTP_SECRET environment variable, for example
    # generated with: openssl rand -base64 48
    secret: ""
    contact_requests_per_hour: 5   # Codes issued to one email address or mobile number
    contact_attempts_per_hour: 10  # Verification attempts for one contact across all of its codes
    # Development only: write sign-in codes to the log instead of delivering
    # them. The server refuses to start with this enabled in release mode
    # (GIN_MODE=release).
    dev_log_codes: false

# Delivery of sign-in codes. Codes are queued on the notifications exchange
# and a worker delivers them over the channel that matches the contact: email
# addresses by SMTP and mobile numbers by SMS. A contact type without a
# configured channel cannot sign in.
notifications:
  email:
    host: ""                # Empty disables email
    port: 587
    username: ""
    password: ""            # Or set SMTP_PASSWORD
    from: "Exchange <no-reply@example.com>"
    implicit_tls: false     # true for implicit TLS, usually on port 465
    timeout_seconds: 10
    # Go text/template templates with {{.Code}} and {{.TTLSeconds}}. Write
    # them in the language of your users.
    otp_subject: "Your sign-in code"
    otp_body: |
      Your sign-in code is {{.Code}}. It expires in {{.TTLSeconds}} seconds.

      If you did not request this code, you can ignore this email. Never share it with anyone.
  sms:
    provider: ""            # "kavenegar", or empty to disable SMS
    kavenegar:
      api_key: ""           # Or set KAVENEGAR_API_KEY
      otp_template: ""      # A verify template approved in the Kavenegar panel; the code fills %token
      base_url: "https://api.kavenegar.com"
      timeout_seconds: 10
  worker:
    concurrency: 4          # Codes delivered in parallel
    max_attempts: 3         # Attempts per code; delivery also stops when the code expires

admin:
  # Encrypts the authenticator (TOTP) secrets of administrators: 32 random
  # bytes, base64-encoded (openssl rand -base64 32). Admin sign-in is disabled
  # without it. Prefer the ADMIN_TOTP_KEY environment variable; the server and
  # the cmd/admin command must use the same key.
  totp_key: ""

# Data-protection keys, wrapped by a key-encryption key (KEK) in a key
# management service; see docs/data-protection.md. No feature uses them yet.
keys:
  # "transit" (HashiCorp Vault or OpenBao), "local" (development only, refused
  # in release mode), or empty to load no keys.
  provider: ""
  local:
    kek: ""                 # Prefer KEYS_LOCAL_KEK (openssl rand -base64 32)
  transit:
    address: ""             # VAULT_ADDR, such as https://vault.internal:8200
    token: ""               # Prefer VAULT_TOKEN, or token_file
    token_file: ""          # Read on every request, so an agent can renew it
    mount: "transit"
    key: ""                 # The Transit key that wraps the data keys
    ca_cert: ""             # VAULT_CACERT: PEM file of the CAs to trust
    timeout_seconds: 10

websocket:
  # Origins accepted by the WebSocket origin check; empty allows same-origin
  # connections only. Release mode refuses "*" and origins without https.
  allowed_origins: []
  ping_interval_seconds: 30        # Parsed, but not used yet (#47)
  max_message_size_bytes: 1048576  # Parsed, but not used yet (#47)

# The sections from here to observability are parsed but not used yet, except
# exchange.name, which authenticator apps show as the issuer. They describe
# the configuration of roadmap features; see "Settings reserved for roadmap
# features" in docs/configuration.md.
exchange:
  name: "Crypto Exchange"
  timezone: "UTC"
  maintenance_window:
    enabled: false
    start: "02:00"
    end: "04:00"
    timezone: "UTC"

assets:
  registry_path: "config/assets.yaml"
  auto_sync: true

markets:
  default_maker_fee_bps: 10
  default_taker_fee_bps: 20
  enable_market_orders: true
  enable_stop_orders: true

price_aggregator:
  enabled: true
  providers:
    - name: "binance"
      enabled: true
      type: "websocket"
      ws_endpoint: "wss://stream.binance.com:9443/ws"
      rest_endpoint: "https://api.binance.com"
      api_key: ""  # Set with BINANCE_API_KEY
      api_secret: ""  # Set with BINANCE_API_SECRET
      passphrase: ""
      symbols:
        - "btcusdt"
        - "ethusdt"
        - "trxusdt"
        - "usdtusd"
      rate_limit: 10
      timeout_seconds: 10
      reconnect_delay_seconds: 5
    - name: "coinbase"
      enabled: false
      type: "websocket"
      ws_endpoint: "wss://ws-feed.exchange.coinbase.com"
      rest_endpoint: "https://api.exchange.coinbase.com"
      api_key: ""
      api_secret: ""
      passphrase: ""
      symbols:
        - "BTC-USD"
        - "ETH-USD"
      rate_limit: 10
      timeout_seconds: 10
      reconnect_delay_seconds: 5
    - name: "kraken"
      enabled: false
      type: "websocket"
      ws_endpoint: "wss://ws.kraken.com"
      rest_endpoint: "https://api.kraken.com"
      symbols:
        - "XBT/USD"
        - "ETH/USD"
      rate_limit: 5
      timeout_seconds: 10
      reconnect_delay_seconds: 10
    - name: "bybit"
      enabled: false
      type: "websocket"
      ws_endpoint: "wss://stream.bybit.com/v5/public/spot"
      rest_endpoint: "https://api.bybit.com"
      symbols:
        - "BTCUSDT"
        - "ETHUSDT"
      rate_limit: 20
      timeout_seconds: 10
      reconnect_delay_seconds: 5
  aggregation_interval_ms: 100
  vwap_windows_seconds: [1, 5, 60, 300]
  outlier_threshold_mad: 3.0
  min_providers: 2
  stale_threshold_ms: 5000
  publish_to_redis: true
  publish_to_rabbitmq: true

custody:
  providers:
    # Bitcoin (UTXO)
    - provider_type: "BTC"
      asset_ids: ["BTC"]
      network: "bitcoin"
      enabled: true
      rpc_endpoints:
        - "http://localhost:8332"  # bitcoind RPC
      ws_endpoints: []
      explorer_api: "https://blockstream.info/api"
      explorer_ws: ""
      api_key: ""
      api_secret: ""
      chain_id: ""
      contract_address: ""
      decimals: 8
      confirmations_required: 3
      min_deposit_amount: "0.0001"
      min_withdrawal_amount: "0.0005"
      max_withdrawal_amount: "10.0"
      default_fee_level: "normal"
      fee_asset_id: "BTC"
      hot_wallet_address: ""
      cold_wallet_address: ""
      block_poll_interval_seconds: 30
      reorg_depth: 6
      sanctions_screening: true

    # Tron (EVM-compatible for USDT TRC20)
    - provider_type: "EVM"
      asset_ids: ["TRX", "USDT"]
      network: "tron"
      enabled: true
      rpc_endpoints:
        - "https://api.trongrid.io"
        - "https://api.trongrid.io/jsonrpc"
      ws_endpoints: []
      explorer_api: "https://apilist.tronscan.org/api"
      explorer_ws: ""
      api_key: ""
      api_secret: ""
      chain_id: "tron-mainnet"
      contract_address: ""
      decimals: 6
      confirmations_required: 19
      min_deposit_amount: "10"
      min_withdrawal_amount: "20"
      max_withdrawal_amount: "1000000"
      default_fee_level: "normal"
      fee_asset_id: "TRX"
      hot_wallet_address: ""
      cold_wallet_address: ""
      block_poll_interval_seconds: 10
      reorg_depth: 19
      sanctions_screening: true

    # Internal ledger (off-chain settlement)
    - provider_type: "INTERNAL"
      asset_ids: ["USD", "EUR", "BTC", "ETH", "TRX", "USDT"]
      network: "internal"
      enabled: true
      rpc_endpoints: []
      confirmations_required: 0
      min_deposit_amount: "0"
      min_withdrawal_amount: "0"
      max_withdrawal_amount: "0"
      default_fee_level: "normal"
      fee_asset_id: ""
      hot_wallet_address: ""
      cold_wallet_address: ""
      block_poll_interval_seconds: 0
      reorg_depth: 0
      sanctions_screening: false

fiat:
  providers:
    - name: "partner_bank"
      enabled: false
      type: "bank_api"
      endpoint: "https://api.partnerbank.com/v1"
      api_key: ""  # Set with FIAT_PROVIDER_API_KEY
      api_secret: ""  # Set with FIAT_PROVIDER_API_SECRET
      cert_path: ""
      key_path: ""
      ca_path: ""
      supported_assets: ["USD", "EUR"]
      webhook_secret: ""
      timeout_seconds: 30

compliance:
  sanctions:
    providers:
      - name: "ofac"
        enabled: true
        priority: 1
        endpoint: "https://www.treasury.gov/ofac/downloads/sdn.csv"
        timeout_seconds: 30
      - name: "chainalysis"
        enabled: false
        api_key: ""  # Set with CHAINALYSIS_API_KEY
        api_secret: ""
        endpoint: "https://api.chainalysis.com/api"
        priority: 2
        timeout_seconds: 10
      - name: "trm"
        enabled: false
        api_key: ""  # Set with TRM_API_KEY
        api_secret: ""
        endpoint: "https://api.trmlabs.com/v1"
        priority: 3
        timeout_seconds: 10
    screen_on_deposit: true
    screen_on_withdrawal: true
    screen_on_trade: false
    periodic_rescreen_hours: 24

  aml:
    enabled: true
    rules_path: "config/aml_rules.yaml"

  kyc:
    providers:
      - name: "manual"
        enabled: true
        endpoint: ""
        timeout_seconds: 0
      - name: "sumsub"
        enabled: false
        api_key: ""  # Set with SUMSUB_API_KEY
        api_secret: ""
        endpoint: "https://api.sumsub.com"
        webhook_secret: ""
        timeout_seconds: 30
      - name: "onfido"
        enabled: false
        api_key: ""  # Set with ONFIDO_API_KEY
        api_secret: ""
        endpoint: "https://api.onfido.com/v3.6"
        webhook_secret: ""
        timeout_seconds: 30
    default_tier: "STANDARD"
    auto_approve_low_risk: false

observability:
  logging:
    level: "info"
    format: "json"
    output: "stdout"
    file_path: ""
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
  tracing:
    enabled: false
    endpoint: ""  # Set with OTEL_ENDPOINT
    service_name: "crypto-exchange"
    sample_rate: 0.1

# Rate limits in Redis. on_error of each limiter (allow or deny) says what
# happens while Redis is unreachable: rest, ws, and trading allow by default,
# auth denies. See docs/configuration.md.
rate_limits:
  timeout_ms: 250  # How long each limiter waits for Redis
  rest:            # Every route, per client IP
    requests_per_second: 100
    burst: 200
  ws:              # WebSocket upgrades, per client IP
    messages_per_second: 50
    burst: 100
  trading:         # /admin/* and /user/*, per signed-in user or administrator
    orders_per_second: 10
    burst: 20
  auth:            # Sign-in, per client IP and route
    login_attempts_per_minute: 5   # Code verifications
    otp_requests_per_hour: 10      # Code requests