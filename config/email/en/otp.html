<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Your sign-in code</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;border:1px solid #e4e7eb;">
<tr><td style="padding:28px 28px 8px;font-size:15px;font-weight:600;color:#52606d;">{{.Sender}}</td></tr>
<tr><td style="padding:8px 28px 0;font-size:20px;font-weight:700;">Your sign-in code</td></tr>
<tr><td style="padding:16px 28px 0;font-size:15px;line-height:1.6;">Enter this code to sign in. It expires in {{.TTLSeconds}} seconds.</td></tr>
<tr><td align="center" style="padding:24px 28px;">
<div style="display:inline-block;padding:14px 24px;border-radius:10px;background:#f0f4ff;border:1px solid #c9d6ff;font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:30px;font-weight:700;letter-spacing:8px;color:#1a3a8f;" dir="ltr">{{.Code}}</div>
</td></tr>
<tr><td style="padding:0 28px 28px;font-size:13px;line-height:1.6;color:#616e7c;">If you did not request this code, you can ignore this email. Never share it with anyone: our staff will never ask for it.</td></tr>
</table>
</td></tr>
</table>
