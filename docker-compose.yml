# Local development environment. Not for production: services use default
# passwords and publish their ports.
#
# Settings come from .env when it exists (copy .env.example), with defaults
# for everything that the services need.

# The project name prefixes the volumes and the network. It is fixed here, so
# that it does not follow the name of the folder that holds the checkout.
name: crypto-exchange

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: crypto-exchange-postgres
    environment:
      # The superuser of the container, which only creates the two roles of
      # the service below (#180); neither the server nor the migrations use it.
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-exchange}
      EXCHANGE_MIGRATIONS_USER: ${POSTGRES_MIGRATIONS_USER:-exchange_owner}
      EXCHANGE_MIGRATIONS_PASSWORD: ${POSTGRES_MIGRATIONS_PASSWORD:-exchange_owner}
      EXCHANGE_RUNTIME_USER: ${POSTGRES_USER:-exchange_app}
      EXCHANGE_RUNTIME_PASSWORD: ${POSTGRES_PASSWORD:-exchange_app}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, on an empty volume. A volume created before #180 keeps its
      # single role: remove it with "docker compose down -v" to start over.
      - ./scripts/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crypto-exchange-network

  redis:
    image: redis:7-alpine
    container_name: crypto-exchange-redis
    # noeviction (#305): a full Redis refuses writes, which the server
    # answers with 503, instead of dropping logged-out tokens or the attempt
    # counters of sign-in codes, which would pass their checks silently.
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis} --maxmemory 256mb --maxmemory-policy noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # PING changes no data, unlike the INCR the check used before.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crypto-exchange-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: crypto-exchange-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: /
      # Passing the Erlang cookie on the command line avoids reading
      # .erlang.cookie, which fails with "eacces" on some Docker Desktop and
      # WSL 2 setups. The distribution ports are not published, so the cookie
      # is only used inside the container.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -setcookie ${RABBITMQ_ERLANG_COOKIE:-local-development-cookie}
      RABBITMQ_CTL_ERL_ARGS: -setcookie ${RABBITMQ_ERLANG_COOKIE:-local-development-cookie}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crypto-exchange-network

  # The release step (#180): applies the migrations with the migration role
  # and grants the runtime role, then exits; the app starts after it.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/admin", "-config", "config/config.compose.yaml", "migrate"]
    environment:
      # The image defaults to release mode (#306); this is development.
      - SERVER_MODE=${SERVER_MODE:-debug}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-exchange_app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-exchange_app}
      - POSTGRES_DB=${POSTGRES_DB:-exchange}
      - POSTGRES_MIGRATIONS_USER=${POSTGRES_MIGRATIONS_USER:-exchange_owner}
      - POSTGRES_MIGRATIONS_PASSWORD=${POSTGRES_MIGRATIONS_PASSWORD:-exchange_owner}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    networks:
      - crypto-exchange-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-exchange-app
    # On Linux, set APP_UID and APP_GID to your own IDs (id -u, id -g) so
    # that the server can read the JWT key files without widening their
    # permissions.
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    command: ["-config", "config/config.compose.yaml"]
    # Docker kills the container 10 seconds after SIGTERM by default, while
    # the server may take server.shutdown_timeout_seconds (30) to stop.
    stop_grace_period: 40s
    # Every variable in .env reaches the server. The ones below take
    # precedence: they give the defaults, and keep the container's addresses,
    # port, and key paths whatever .env says for running outside Compose.
    env_file:
      - path: .env
        required: false
    environment:
      # The image defaults to release mode (#306); this is development.
      - SERVER_MODE=${SERVER_MODE:-debug}
      - SERVER_IP=0.0.0.0
      - SERVER_PORT=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-exchange_app}
      - POSTGRES_DB=${POSTGRES_DB:-exchange}
      # The migrate service has migrated; the server only checks the version,
      # and never receives the migration role's password, even from .env.
      - POSTGRES_MIGRATIONS_MODE=external
      - POSTGRES_MIGRATIONS_USER=
      - POSTGRES_MIGRATIONS_PASSWORD=
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - JWT_SSL_USER_PRIVATE_KEY=/run/secrets/jwt_user_private_key
      - JWT_SSL_USER_PUBLIC_KEY=/run/secrets/jwt_user_public_key
      # Admin keys are not mounted. An empty value leaves the setting of
      # config.compose.yaml, which has none.
      - JWT_SSL_ADMIN_PRIVATE_KEY=
      - JWT_SSL_ADMIN_PUBLIC_KEY=
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-exchange_app}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - OTP_SECRET=${OTP_SECRET:-}
      - ADMIN_TOTP_KEY=${ADMIN_TOTP_KEY:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - KAVENEGAR_API_KEY=${KAVENEGAR_API_KEY:-}
    secrets:
      - jwt_user_private_key
      - jwt_user_public_key
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    networks:
      - crypto-exchange-network

secrets:
  # Generate the keys as described in the README, or point these variables
  # at other files.
  jwt_user_private_key:
    file: ${JWT_USER_PRIVATE_KEY_FILE:-./internal/ssl/user/private_key.pem}
  jwt_user_public_key:
    file: ${JWT_USER_PUBLIC_KEY_FILE:-./internal/ssl/user/public_key.pem}

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  crypto-exchange-network:
    driver: bridge
