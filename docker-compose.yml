# Local development environment. Not for production: services use default
# passwords and publish their ports.
#
# Settings come from .env when it exists (copy .env.example), with defaults
# for everything that the services need.
services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: encrypted-db-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-exchange}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - encrypted-db-network

  redis:
    image: redis:7-alpine
    container_name: encrypted-db-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis} --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # PING changes no data, unlike the INCR the check used before.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - encrypted-db-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: encrypted-db-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: /
      # Passing the Erlang cookie on the command line avoids reading
      # .erlang.cookie, which fails with "eacces" on some Docker Desktop and
      # WSL 2 setups. The distribution ports are not published, so the cookie
      # is only used inside the container.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -setcookie ${RABBITMQ_ERLANG_COOKIE:-local-development-cookie}
      RABBITMQ_CTL_ERL_ARGS: -setcookie ${RABBITMQ_ERLANG_COOKIE:-local-development-cookie}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - encrypted-db-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: encrypted-db-app
    # On Linux, set APP_UID and APP_GID to your own IDs (id -u, id -g) so
    # that the server can read the JWT key files without widening their
    # permissions.
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    command: ["-config", "config/config.compose.yaml"]
    # Every variable in .env reaches the server. The ones below take
    # precedence: they give the defaults, and keep the container's addresses,
    # port, and key paths whatever .env says for running outside Compose.
    env_file:
      - path: .env
        required: false
    environment:
      - SERVER_IP=0.0.0.0
      - SERVER_PORT=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-exchange}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - JWT_SSL_USER_PRIVATE_KEY=/run/secrets/jwt_user_private_key
      - JWT_SSL_USER_PUBLIC_KEY=/run/secrets/jwt_user_public_key
      # Admin keys are not mounted. An empty value leaves the setting of
      # config.compose.yaml, which has none.
      - JWT_SSL_ADMIN_PRIVATE_KEY=
      - JWT_SSL_ADMIN_PUBLIC_KEY=
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis}
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - OTP_SECRET=${OTP_SECRET:-}
      - ADMIN_TOTP_KEY=${ADMIN_TOTP_KEY:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - KAVENEGAR_API_KEY=${KAVENEGAR_API_KEY:-}
    secrets:
      - jwt_user_private_key
      - jwt_user_public_key
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    networks:
      - encrypted-db-network

secrets:
  # Generate the keys as described in the README, or point these variables
  # at other files.
  jwt_user_private_key:
    file: ${JWT_USER_PRIVATE_KEY_FILE:-./internal/ssl/user/private_key.pem}
  jwt_user_public_key:
    file: ${JWT_USER_PUBLIC_KEY_FILE:-./internal/ssl/user/public_key.pem}

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  encrypted-db-network:
    driver: bridge
